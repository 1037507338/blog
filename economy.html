<script>
// 用 IIFE 包裹，使顶层 const/let 成为函数局部，支持 SPA 切页重复执行而不冲突
(function(){
// 14 个分类（key 对应后端 Economy_<key>）+ 「全部」聚合
const ECO_CATS = [
  ['All','全部'],
  ['Currency','通货'],['Fragments','碎片'],['Essences','精华'],['Runes','符文'],
  ['Gems','宝石'],['Soul_Cores','灵核'],['Uncut_Gems','未切割宝石'],['Idols','雕像'],
  ['Breach','裂隙'],['Delirium','惊悸迷雾'],['Expedition','先祖秘藏'],['Ritual','驱灵仪式'],
  ['Abyss','深渊'],['Atziris_Temple','阿兹里神庙'],
];
let ecoCat = 'Currency';
let ecoData = null;
const ecoCache = {};
let ecoFavOnly = false;
let ecoSort = { key: 'default', dir: 'desc' };
let ecoPage = 1;
const PAGE_SIZE = 50;
const ECO_FAV_KEY = 'poe2_eco_favs';

// 分类 key → 中文名映射（用于过滤）
const ECO_CAT_CN = {
  Currency:'通货',Fragments:'碎片',Essences:'精华',Runes:'符文',
  Gems:'宝石',Soul_Cores:'灵核',Uncut_Gems:'未切割宝石',Idols:'雕像',
  Breach:'裂隙',Delirium:'惊悸迷雾',Expedition:'先祖秘藏',Ritual:'驱灵仪式',
  Abyss:'深渊',Atziris_Temple:'阿兹里神庙',
};

// ===== 收藏数据源：登录→云端(内存 Set，来自 /api/favorites)；未登录→localStorage =====
let ecoLoggedIn = false;
let ecoCloudFavs = new Set();

function ecoLocalFavs() { try { return new Set(JSON.parse(localStorage.getItem(ECO_FAV_KEY) || '[]')); } catch { return new Set(); } }
function ecoSaveLocalFavs(set) { localStorage.setItem(ECO_FAV_KEY, JSON.stringify([...set])); }

// 当前生效的收藏集合（渲染/过滤用）
function ecoFavs() { return ecoLoggedIn ? ecoCloudFavs : ecoLocalFavs(); }

async function ecoApi(method, body) {
  const token = window.Auth ? await Auth.getAccessToken() : null;
  if (!token) return null;
  const opt = { method, headers: { 'Authorization': 'Bearer ' + token } };
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch('/api/favorites', opt);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// 登录后：合并本地收藏上云 → 拉取云端列表 → 切换数据源 → 重渲染
async function ecoOnLogin() {
  ecoLoggedIn = true;
  try {
    const local = [...ecoLocalFavs()];
    const res = local.length
      ? await ecoApi('POST', { action: 'merge', items: local })
      : await ecoApi('GET');
    ecoCloudFavs = new Set((res && res.items) || []);
  } catch (e) {
    console.warn('[fav] 云端收藏加载失败，暂用本地', e);
    ecoLoggedIn = false; // 回退本地，避免误清空
  }
  renderEconomy();
}

function ecoOnLogout() {
  ecoLoggedIn = false;
  ecoCloudFavs = new Set();
  renderEconomy();
}
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function parseNum(s) { return parseFloat(String(s).replace(/,/g, '')) || 0; }

function renderCatTabs() {
  const wrap = document.getElementById('eco-cats');
  wrap.innerHTML = ECO_CATS.map(([k, label]) =>
    '<button class="eco-cat' + (k === ecoCat ? ' active' : '') + '" data-cat="' + k + '">' + esc(label) + '</button>'
  ).join('');
  wrap.querySelectorAll('.eco-cat').forEach(btn => {
    btn.addEventListener('click', () => switchCat(btn.dataset.cat));
  });
}

// 切换分类时重置页码/搜索/排序
async function switchCat(cat) {
  if (cat === ecoCat) return;
  ecoCat = cat;
  ecoSort = { key: 'default', dir: 'desc' };
  ecoPage = 1;
  const s = document.getElementById('eco-search'); if (s) s.value = '';
  renderCatTabs();
  applyDivineCnyVisibility();
  await loadEconomy();
}

async function fetchCat(cat) {
  if (ecoCache[cat]) return ecoCache[cat];
  // 直接读取预生成的 JSON 文件，废弃原 API 实时抓取
  const resp = await fetch('/data/economy-data.json');
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const allData = await resp.json();
  // 缓存全量数据
  ecoCache['All'] = allData;
  // 按分类过滤（如果需要单分类）
  if (cat === 'All') return allData;
  const items = (allData.items || []).filter(it => it.catCn === ECO_CAT_CN[cat]);
  ecoCache[cat] = { ...allData, cat, label: ECO_CAT_CN[cat] || cat, items };
  return ecoCache[cat];
}

async function loadEconomy() {
  const box = document.getElementById('eco-content');
  // 命中缓存：直接渲染，不重抓
  if (ecoCache[ecoCat]) {
    ecoData = ecoCache[ecoCat];
    updateFetchedLabel();
    renderEconomy();
    return;
  }
  box.innerHTML = '<div class="eco-state">正在加载行情...</div>';
  try {
    ecoData = await fetchCat(ecoCat);
    updateFetchedLabel();
    renderEconomy();
  } catch (e) {
    box.innerHTML = '<div class="eco-state">❌ 行情加载失败，请稍后重试（' + esc(e.message) + '）</div>';
  }
}

function updateFetchedLabel() {
  const el = document.getElementById('eco-fetched');
  if (ecoData && ecoData.fetched_at) {
    const t = new Date(ecoData.fetched_at * 1000);
    el.textContent = ' · 更新于 ' + t.toLocaleString('zh-CN', { hour12: false });
  } else el.textContent = '';
  // 汇率展示
  const rEl = document.getElementById('eco-rates');
  if (rEl && ecoData && ecoData.rates) {
    const r = ecoData.rates;
    const parts = [];
    if (r.exalted) parts.push('1神圣石≈' + Math.round(1 / r.exalted) + '崇高石');
    if (r.chaos) parts.push('1神圣石≈' + Math.round(1 / r.chaos) + '混沌石');
    rEl.textContent = parts.length ? ' · 当前汇率 ' + parts.join('、') : '';
  } else if (rEl) rEl.textContent = '';
}

function toggleEcoFavOnly() {
  ecoFavOnly = !ecoFavOnly;
  document.getElementById('eco-fav-toggle').classList.toggle('active', ecoFavOnly);
  renderEconomy();
}

function toggleEcoFav(name) {
  if (ecoLoggedIn) {
    // 乐观更新内存 Set + UI，再异步落库；失败则回滚
    const adding = !ecoCloudFavs.has(name);
    if (adding) ecoCloudFavs.add(name); else ecoCloudFavs.delete(name);
    renderEconomy();
    ecoApi(adding ? 'POST' : 'DELETE', { item_name: name }).catch(e => {
      console.warn('[fav] 同步失败，回滚', e);
      if (adding) ecoCloudFavs.delete(name); else ecoCloudFavs.add(name);
      renderEconomy();
    });
  } else {
    const favs = ecoLocalFavs();
    if (favs.has(name)) favs.delete(name); else favs.add(name);
    ecoSaveLocalFavs(favs);
    renderEconomy();
  }
}

// 点击表头：同列切换升/降序，换列默认降序
function ecoSortBy(key) {
  if (ecoSort.key === key) ecoSort.dir = ecoSort.dir === 'desc' ? 'asc' : 'desc';
  else { ecoSort.key = key; ecoSort.dir = 'desc'; }
  ecoPage = 1;
  renderEconomy();
}

function sparkSvg(path, up) {
  if (!path) return '';
  const color = up ? '#6fcf6f' : '#f0808a';
  return '<svg class="eco-spark" viewBox="0 0 60 22" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="' + esc(path) + '" fill="none" stroke="' + color + '" stroke-width="2"/></svg>';
}

function arrowFor(key) {
  if (ecoSort.key !== key) return '<span class="arrow">⇅</span>';
  return '<span class="arrow">' + (ecoSort.dir === 'desc' ? '↓' : '↑') + '</span>';
}

// 神圣石单价友好显示：大数取整/2位，小数按量级保留有效位
function fmtDivine(v) {
  if (v == null) return '—';
  if (v >= 100) return Math.round(v).toLocaleString('en-US');
  if (v >= 1) return (Math.round(v * 100) / 100).toString();
  if (v >= 0.01) return (Math.round(v * 1000) / 1000).toString();
  return v.toPrecision(2); // 极小值，如 0.0033
}
// 原始计价友好显示
function fmtUnit(v) {
  if (v == null) return '';
  if (v >= 100) return Math.round(v).toLocaleString('en-US');
  if (v >= 1) return (Math.round(v * 100) / 100).toString();
  return (Math.round(v * 1000) / 1000).toString();
}

function ecoGoPage(p) { ecoPage = p; renderEconomy(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function renderEconomy() {
  const box = document.getElementById('eco-content');
  if (!ecoData || !ecoData.items) return;
  const favs = ecoFavs();
  const isAll = ecoCat === 'All';
  const kw = (document.getElementById('eco-search')?.value || '').trim().toLowerCase().split(/\s+/).filter(Boolean);

  let rows = ecoData.items.slice();
  if (ecoFavOnly) rows = rows.filter(r => favs.has(r.name));
  if (kw.length) rows = rows.filter(r => kw.every(k => r.name.toLowerCase().includes(k)));

  if (!rows.length) { box.innerHTML = '<div class="eco-state">未找到匹配结果</div>'; return; }

  // 统一排序（价格按神圣石单价，全表可比）
  const trendVal = r => (r.trendUp ? 1 : -1) * Math.abs(parseNum(r.trendPct));
  const k = ecoSort.key, asc = ecoSort.dir === 'asc';
  const dir = asc ? 1 : -1;
  if (k === 'price') rows.sort((a, b) => ((a.priceDivine ?? -1) - (b.priceDivine ?? -1)) * dir);
  else if (k === 'trend') rows.sort((a, b) => (trendVal(a) - trendVal(b)) * dir);
  else if (k === 'vol') rows.sort((a, b) => (parseNum(a.volume) - parseNum(b.volume)) * dir);

  // 分页（仅「全部」）
  const total = rows.length;
  const totalPages = isAll ? Math.max(1, Math.ceil(total / PAGE_SIZE)) : 1;
  if (ecoPage > totalPages) ecoPage = totalPages;
  const pageRows = isAll ? rows.slice((ecoPage - 1) * PAGE_SIZE, ecoPage * PAGE_SIZE) : rows;

  let html = (ecoData.stale ? '<div class="eco-note">⚠️ 当前为缓存数据，上游暂时不可用，价格可能略有延迟</div>' : '')
    + '<div class="eco-scroll"><table class="eco-table"><thead><tr>'
    + '<th class="col-fav"></th><th class="col-name">名称</th>'
    + (isAll ? '<th class="col-cat">分类</th>' : '')
    + '<th class="col-price sortable' + (k === 'price' ? ' sort-active' : '') + '" onclick="ecoSortBy(\'price\')">神圣石价' + arrowFor('price') + '</th>'
    + '<th class="col-orig">原始价</th>'
    + '<th class="col-spark">近7天</th>'
    + '<th class="col-num sortable' + (k === 'trend' ? ' sort-active' : '') + '" onclick="ecoSortBy(\'trend\')">涨跌' + arrowFor('trend') + '</th>'
    + '<th class="col-num sortable' + (k === 'vol' ? ' sort-active' : '') + '" onclick="ecoSortBy(\'vol\')">24h成交量' + arrowFor('vol') + '</th>'
    + '</tr></thead><tbody>';
  pageRows.forEach(r => {
    const fav = favs.has(r.name);
    const trendCls = r.trendUp ? 'eco-up' : 'eco-down';
    const arrow = r.trendUp ? '▲' : '▼';
    html += '<tr>'
      + '<td class="col-fav"><button class="eco-fav' + (fav ? ' on' : '') + '" title="收藏" data-fav="' + esc(r.name) + '">⭐</button></td>'
      + '<td class="col-name"><div class="eco-name">' + (r.icon ? '<img class="eco-icon" src="' + esc(r.icon) + '" alt="" loading="lazy">' : '') + '<span class="eco-itemname">' + esc(r.name) + '</span></div></td>'
      + (isAll ? '<td class="col-cat"><span class="eco-cattag">' + esc(r.catCn || '') + '</span></td>' : '')
      + '<td class="col-price eco-price"><span class="num">' + fmtDivine(r.priceDivine) + '</span></td>'
      + '<td class="col-orig eco-orig"><span class="oq">' + fmtUnit(r.unitQty) + '</span><span class="unit">' + esc(r.baseCn) + '</span></td>'
      + '<td class="col-spark">' + sparkSvg(r.spark, r.trendUp) + '</td>'
      + '<td class="col-num ' + trendCls + '">' + arrow + ' ' + esc(r.trendPct) + '</td>'
      + '<td class="col-num eco-vol">' + esc(r.volume) + '</td>'
      + '</tr>';
  });
  html += '</tbody></table></div>';

  // 分页控件（仅「全部」且多于一页）
  if (isAll && totalPages > 1) {
    html += '<div class="eco-pager">';
    html += '<button class="eco-pgbtn" ' + (ecoPage <= 1 ? 'disabled' : 'data-pg="' + (ecoPage - 1) + '"') + '>‹ 上一页</button>';
    html += '<span class="eco-pginfo">第 ' + ecoPage + ' / ' + totalPages + ' 页 · 共 ' + total + ' 项</span>';
    html += '<button class="eco-pgbtn" ' + (ecoPage >= totalPages ? 'disabled' : 'data-pg="' + (ecoPage + 1) + '"') + '>下一页 ›</button>';
    html += '</div>';
  }

  box.className = '';
  box.innerHTML = html;
  box.querySelectorAll('.eco-fav').forEach(btn => {
    btn.addEventListener('click', () => toggleEcoFav(btn.dataset.fav));
  });
  box.querySelectorAll('.eco-pgbtn[data-pg]').forEach(btn => {
    btn.addEventListener('click', () => ecoGoPage(parseInt(btn.dataset.pg, 10)));
  });
}

// 暴露内联 onclick/oninput 引用的处理函数到全局

window.ecoOnSearch = function(){ ecoPage = 1; renderEconomy(); };

renderCatTabs();

// 加载神圣石人民币汇率
async function loadDivineCny() {
  try {
    const resp = await fetch('/api/site-config?key=economy_divine_cny');
    if (!resp.ok) return;
    const { value } = await resp.json();
    if (!value) return;
    // 加载显隐配置
    let visible = true;
    try {
      const visResp = await fetch('/api/site-config?key=economy_divine_cny_visible');
      if (visResp.ok) {
        const { value: v } = await visResp.json();
        visible = v !== false;
      }
    } catch {}
    // 保存数据供 switchCat 使用
    window._divineCny = { value, visible };
    applyDivineCnyVisibility();
    // 加载历史数据，取距离今天最近的日期展示
    try {
      const histResp = await fetch('/api/site-config?key=economy_divine_cny_history');
      if (histResp.ok) {
        const { value: history } = await histResp.json();
        if (Array.isArray(history) && history.length >= 2) {
          renderCnyChart(history);
          // 取距离今天最近的日期
          const nearest = findNearestDate(history);
          if (nearest) {
            document.getElementById('eco-cny-price').textContent = '¥' + nearest.price.toFixed(2) + ' / 1 神圣石';
            document.getElementById('eco-cny-date').textContent = nearest.date || '暂无数据';
            window._divineCny = { value: nearest, visible };
          }
        }
      }
    } catch {}
  } catch {}
}

// 从历史中找距离今天最近的日期
function findNearestDate(history) {
  const now = new Date();
  const todayMD = (now.getMonth()+1).toString().padStart(2,'0') + '/' + now.getDate().toString().padStart(2,'0');
  // 先看今天有无数据
  const today = history.find(h => h.date === todayMD);
  if (today) return today;
  // 否则取差值最小的（按日期排序，找最近）
  const todayNum = now.getTime();
  let best = null, bestDiff = Infinity;
  for (const h of history) {
    const parts = h.date.split('/');
    if (parts.length < 2) continue;
    const d = new Date(now.getFullYear(), parseInt(parts[0])-1, parseInt(parts[1]));
    const diff = Math.abs(d.getTime() - todayNum);
    if (diff < bestDiff) { bestDiff = diff; best = h; }
  }
  return best;
}

// 根据当前分类控制汇率卡片显隐：仅「全部」和「通货」展示
function applyDivineCnyVisibility() {
  const card = document.getElementById('eco-divine-cny');
  if (!card) return;
  const cfg = window._divineCny;
  if (!cfg || !cfg.value || cfg.visible === false) { card.style.display = 'none'; return; }
  const show = (ecoCat === 'All' || ecoCat === 'Currency');
  card.style.display = show ? '' : 'none';
}

// SVG 折线图 + 竖虚线悬停
function renderCnyChart(allData) {
  const box = document.getElementById('eco-cny-chart');
  if (!box || allData.length < 2) return;
  // 只展示最近 10 天
  const data = allData.slice(-10);
  const w = Math.max(box.clientWidth || 400, 300);
  const h = Math.max(box.clientHeight || 140, 120);
  const pad = { t: 14, r: 12, b: 20, l: 48 };
  const pw = w - pad.l - pad.r;
  const ph = h - pad.t - pad.b;
  const prices = data.map(d => d.price);
  const minP = Math.min(...prices);
  const maxP = Math.max(...prices);
  const yMin = Math.min(0.1, minP);
  const yMax = maxP;
  const range = yMax - yMin || 1;
  const pts = data.map((d, i) => {
    const x = pad.l + (i / (data.length - 1)) * pw;
    const y = pad.t + (1 - (d.price - yMin) / range) * ph;
    return { x: +x.toFixed(1), y: +y.toFixed(1), ...d };
  });
  const pathD = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ' ' + p.y).join(' ');
  const areaD = pathD + ' L' + pts[pts.length - 1].x + ' ' + (pad.t + ph) + ' L' + pts[0].x + ' ' + (pad.t + ph) + ' Z';
  // X 轴日期标签（最多5个，最后一个始终显示）
  const step = data.length <= 5 ? 1 : Math.ceil((data.length - 1) / 4);
  const labels = data.map((d, i) => {
    const isLast = i === data.length - 1;
    if (!isLast && i % step !== 0) return '';
    const x = pad.l + (i / (data.length - 1)) * pw;
    const anchor = isLast ? 'end' : 'middle';
    return '<text x="' + x.toFixed(1) + '" y="' + (h - 2) + '" text-anchor="' + anchor + '" fill="var(--subtext)" font-size="10">' + (d.date || '').slice(-5) + '</text>';
  }).join('');
  // Y 轴价格标签（显示 yMin 和 yMax）
  const yLabels = [
    '<text x="' + (pad.l - 8) + '" y="' + (pad.t + 4) + '" text-anchor="end" fill="var(--subtext)" font-size="10">' + yMax.toFixed(1) + '</text>',
    '<text x="' + (pad.l - 8) + '" y="' + (pad.t + ph + 4) + '" text-anchor="end" fill="var(--subtext)" font-size="10">' + yMin.toFixed(1) + '</text>'
  ].join('');
  // 竖虚线（隐藏）
  const cursorLineId = 'cny-cursor-line';
  const tooltipId = 'cny-tip';
  const svg = '<svg width="' + w + '" height="' + h + '" xmlns="http://www.w3.org/2000/svg" id="cny-chart-svg" style="cursor:pointer">'
    + '<defs><linearGradient id="cnyGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c9a227" stop-opacity="0.3"/><stop offset="100%" stop-color="#c9a227" stop-opacity="0.02"/></linearGradient></defs>'
    + '<path d="' + areaD + '" fill="url(#cnyGrad)"/>'
    + '<path d="' + pathD + '" fill="none" stroke="#c9a227" stroke-width="2" stroke-linejoin="round"/>'
    + pts.map(p => '<circle cx="' + p.x + '" cy="' + p.y + '" r="3" fill="#c9a227" stroke="#1a140c" stroke-width="1"/>').join('')
    + labels + yLabels
    + '<line x1="0" y1="' + pad.t + '" x2="0" y2="' + (pad.t+ph) + '" id="' + cursorLineId + '" stroke="#c9a227" stroke-width="1" stroke-dasharray="4,3" style="opacity:0;pointer-events:none"/>'
    + '<line x1="' + pad.l + '" y1="' + (pad.t + ph) + '" x2="' + (pad.l + pw) + '" y2="' + (pad.t + ph) + '" stroke="var(--border,rgba(77,58,31,.5))" stroke-width="0.5"/>'
    + '<rect id="cny-tip-bg" rx="3" ry="3" fill="rgba(26,20,12,0.88)" stroke="#c9a227" stroke-width="0.5" style="opacity:0;pointer-events:none"/>'
    + '<text id="' + tooltipId + '" x="' + (pad.l + pw/2) + '" y="' + (pad.t + 2) + '" text-anchor="middle" fill="#c9a227" font-size="13" font-weight="600" style="opacity:0;transition:opacity .12s;pointer-events:none"/>'
    + '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="transparent" id="cny-hitarea"/>'
    + '</svg>';
  box.innerHTML = svg;
  // 绑定竖虚线悬停
  const svgEl = document.getElementById('cny-chart-svg');
  const hitArea = document.getElementById('cny-hitarea');
  const cursorLine = document.getElementById(cursorLineId);
  const tipEl = document.getElementById(tooltipId);
  const tipBg = document.getElementById('cny-tip-bg');
  hitArea.addEventListener('mousemove', e => {
    const rect = svgEl.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    // 找到最近的数据点
    let nearest = pts[0], minDist = Infinity;
    for (const p of pts) {
      const d = Math.abs(p.x - mx);
      if (d < minDist) { minDist = d; nearest = p; }
    }
    cursorLine.setAttribute('x1', nearest.x);
    cursorLine.setAttribute('x2', nearest.x);
    cursorLine.style.opacity = '1';
    tipEl.textContent = nearest.date + ': ¥' + nearest.price.toFixed(2);
    // tooltip动态定位：近左→靠右、近右→靠左、居中则居中
    const tw = tipEl.getComputedTextLength();
    const tPad = 8;
    let anchor, tipX;
    if (nearest.x - tw/2 < pad.l + tPad) {
      anchor = 'start';
      tipX = pad.l + tPad;
    } else if (nearest.x + tw/2 > pad.l + pw - tPad) {
      anchor = 'end';
      tipX = pad.l + pw - tPad;
    } else {
      anchor = 'middle';
      tipX = nearest.x;
    }
    tipEl.setAttribute('text-anchor', anchor);
    tipEl.setAttribute('x', tipX);
    tipEl.style.opacity = '1';
    // 背景框跟随
    const tw2 = tipEl.getComputedTextLength();
    const bgW = tw2 + 14;
    const bgH = 20;
    const bgY = parseInt(tipEl.getAttribute('y')) - bgH + 6;
    let bgX;
    if (anchor === 'start') bgX = tipX - 5;
    else if (anchor === 'end') bgX = tipX - bgW + 5;
    else bgX = tipX - bgW / 2;
    tipBg.setAttribute('x', bgX);
    tipBg.setAttribute('y', bgY);
    tipBg.setAttribute('width', bgW);
    tipBg.setAttribute('height', bgH);
    tipBg.style.opacity = '1';
  });
  hitArea.addEventListener('mouseleave', () => {
    cursorLine.style.opacity = '0';
    tipEl.style.opacity = '0';
    tipBg.style.opacity = '0';
  });
}
})();
