/* ===== 大盘行情页 ===== */
/* 分类切换 Tab（上侧横向） */
.eco-cats{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px;}
.eco-cat{padding:6px 14px;border-radius:3px;font-size:.84rem;font-weight:600;font-family:'Noto Serif SC',serif;letter-spacing:.03em;cursor:pointer;background:rgba(40,30,15,.55);color:#b8a47a;border:1px solid #4d3a1f;transition:all .2s;white-space:nowrap;}
.eco-cat:hover{color:#f4dc99;border-color:#c9a227;}
.eco-cat.active{background:linear-gradient(135deg,#c9a227,#8b6914);color:#1a140c;border-color:#c9a227;font-weight:700;}
.eco-note{color:#897653;font-size:.82rem;margin:0 0 16px;padding:10px 12px;background:rgba(201,162,39,0.06);border-left:3px solid #c9a227;border-radius:0 4px 4px 0;}
.eco-note a{color:#c9a227;font-weight:600;}
.eco-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0;}
.eco-search{flex:1;min-width:240px;padding:8px 14px;background:rgba(37,28,17,.8);border:1px solid #4d3a1f;color:#e8d9b8;border-radius:6px;font-size:.9rem;outline:none;}
.eco-search:focus{border-color:#c9a227;}
.eco-search::placeholder{color:#897653;}
.eco-favbtn{padding:8px 16px;background:rgba(37,28,17,.8);border:1px solid #4d3a1f;color:#b8a47a;border-radius:6px;font-size:.86rem;cursor:pointer;font-family:'Noto Serif SC',serif;white-space:nowrap;transition:all .2s;}
.eco-favbtn:hover{border-color:#c9a227;color:#f4dc99;}
.eco-favbtn.active{background:rgba(201,162,39,.2);border-color:#c9a227;color:#f4dc99;}
.eco-group-title{margin:18px 0 0;padding:8px 4px;font-family:'Noto Serif SC',serif;font-size:.95rem;color:#f4dc99;font-weight:700;border-bottom:1px solid rgba(201,162,39,.3);}
.eco-group-title .eco-group-coin{color:#f4dc99;}
.eco-group-title .eco-group-cnt{color:#897653;font-weight:400;font-size:.84rem;}
.eco-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 4px;border:1px solid #4d3a1f;border-radius:6px;}
.eco-table{width:100%;border-collapse:collapse;min-width:560px;table-layout:fixed;}
.eco-table th,.eco-table td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 列宽固定，保证表头与数据对齐 */
.eco-table .col-fav{width:38px;text-align:center;padding-left:6px;padding-right:0;}
.eco-table .col-name{width:auto;min-width:150px;text-align:left;}
.eco-table .col-num{width:96px;text-align:right;}
.eco-table .col-spark{width:70px;text-align:center;}
.eco-table th{background:rgba(201,162,39,.15);color:#f4dc99;padding:11px 14px;border-bottom:2px solid #c9a227;font-size:.86rem;}
.eco-table th.sortable{cursor:pointer;user-select:none;transition:background .15s;}
.eco-table th.sortable:hover{background:rgba(201,162,39,.28);}
.eco-table th .arrow{display:inline-block;margin-left:4px;font-size:.78rem;color:#897653;}
.eco-table th.sort-active .arrow{color:#f4dc99;}
.eco-table td{padding:9px 14px;border-bottom:1px solid #4d3a1f;vertical-align:middle;}
.eco-table tr:last-child td{border-bottom:none;}
.eco-table tr:hover td{background:rgba(201,162,39,.05);}
.eco-name{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;}
.eco-icon{width:26px;height:26px;flex-shrink:0;object-fit:contain;}
.eco-itemname{color:#e8d9b8;font-weight:600;white-space:nowrap;}
.eco-price{font-weight:600;white-space:nowrap;}
.eco-price .num{color:#f4dc99;font-size:1.02rem;}
.eco-price .unit{color:#b8a47a;font-size:.82rem;margin-left:3px;}
.eco-up{color:#6fcf6f;font-weight:600;}
.eco-down{color:#f0808a;font-weight:600;}
.eco-vol{color:#b8a47a;font-family:monospace;font-size:.88rem;white-space:nowrap;}
.eco-fav{cursor:pointer;font-size:1.1rem;background:none;border:none;padding:0 4px;line-height:1;filter:grayscale(1) opacity(.4);transition:filter .15s;}
.eco-fav.on{filter:none;}
.eco-fav:hover{filter:none;}
.eco-spark{width:60px;height:22px;vertical-align:middle;}
.eco-state{text-align:center;color:#897653;padding:3rem 1rem;font-size:.92rem;}
/* 浅色主题：表格为深色羊皮卷设计，浅底下需改深色文字保证对比度 */
body[data-theme="light"] .eco-scroll{border-color:#d8c9a0;}
body[data-theme="light"] .eco-table th{background:#ede0bd;color:#6b4f0f;border-bottom-color:#c9a227;}
body[data-theme="light"] .eco-table th.sortable:hover{background:#e3d3a3;}
body[data-theme="light"] .eco-table th .arrow{color:#a08a52;}

body[data-theme="light"] .eco-table td{border-bottom-color:#e0d3ac;}

body[data-theme="light"] .eco-itemname{color:#3a2e15;}
body[data-theme="light"] .eco-price .num{color:#8a6d12;}
body[data-theme="light"] .eco-price .unit{color:#7a6a44;}
body[data-theme="light"] .eco-up{color:#1f8a3b;}
body[data-theme="light"] .eco-down{color:#c0392b;}
body[data-theme="light"] .eco-vol{color:#6b5d3a;}
body[data-theme="light"] .eco-cat{background:#ede0bd;color:#6b5530;border-color:#d8c080;}
body[data-theme="light"] .eco-cat:hover{color:#3a2e15;border-color:#c9a227;}
body[data-theme="light"] .eco-cat.active{background:linear-gradient(135deg,#c9a227,#a8841a);color:#fff;border-color:#a8841a;}
body[data-theme="light"] .eco-search{background:#fff;border-color:#d8c9a0;color:#3a2e15;}
body[data-theme="light"] .eco-favbtn{background:#ede0bd;color:#6b5530;border-color:#d8c080;}
body[data-theme="light"] .eco-favbtn.active{background:rgba(201,162,39,.25);color:#6b4f0f;border-color:#c9a227;}
body[data-theme="light"] .eco-group-title{color:#6b4f0f;border-bottom-color:rgba(201,162,39,.4);}
body[data-theme="light"] .eco-group-title .eco-group-coin{color:#6b4f0f;}
body[data-theme="light"] .eco-group-title .eco-group-cnt{color:#a08a52;}

<footer style="text-align:center;padding:2rem 1.5rem;font-size:0.82rem;color:#b8a47a;opacity:0.85">© 2025 POE2 Hub · 仅供学习交流 · 行情数据来源 poe2db.tw</footer>

<script>
// 14 个分类（key 对应后端 Economy_<key>）
const ECO_CATS = [
  ['Currency','通货'],['Fragments','碎片'],['Essences','精华'],['Runes','符文'],
  ['Gems','宝石'],['Soul_Cores','灵核'],['Uncut_Gems','未切割宝石'],['Idols','雕像'],
  ['Breach','裂隙'],['Delirium','惊悸迷雾'],['Expedition','先祖秘藏'],['Ritual','驱灵仪式'],
  ['Abyss','深渊'],['Atziris_Temple','阿兹里神庙'],
];
let ecoCat = 'Currency';
let ecoData = null;            // 当前分类数据
const ecoCache = {};           // { [cat]: payload } 已加载分类缓存
let ecoFavOnly = false;
let ecoSort = { key: 'default', dir: 'desc' }; // key: price|trend|vol|default
const ECO_FAV_KEY = 'poe2_eco_favs';

function ecoFavs() { try { return new Set(JSON.parse(localStorage.getItem(ECO_FAV_KEY) || '[]')); } catch { return new Set(); } }
function ecoSaveFavs(set) { localStorage.setItem(ECO_FAV_KEY, JSON.stringify([...set])); }
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function parseNum(s) { return parseFloat(String(s).replace(/,/g, '')) || 0; }

function renderCatTabs() {
  const wrap = document.getElementById('eco-cats');
  wrap.innerHTML = ECO_CATS.map(([k, label]) =>
    '<button class="eco-cat' + (k === ecoCat ? ' active' : '') + '" data-cat="' + k + '">' + esc(label) + '</button>'
  ).join('');
  wrap.querySelectorAll('.eco-cat').forEach(btn => {
    btn.addEventListener('click', () => switchCat(btn.dataset.cat));
  });
}

async function switchCat(cat) {
  if (cat === ecoCat) return;
  ecoCat = cat;
  // 切分类重置搜索/排序（收藏跨分类共享，保留）
  ecoSort = { key: 'default', dir: 'desc' };
  const s = document.getElementById('eco-search'); if (s) s.value = '';
  renderCatTabs();
  await loadEconomy();
}

async function loadEconomy() {
  const box = document.getElementById('eco-content');
  // 命中缓存：直接渲染，不重抓
  if (ecoCache[ecoCat]) {
    ecoData = ecoCache[ecoCat];
    updateFetchedLabel();
    renderEconomy();
    return;
  }
  box.innerHTML = '<div class="eco-state">正在加载行情...</div>';
  try {
    const resp = await fetch('/api/economy?cat=' + encodeURIComponent(ecoCat));
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    ecoCache[ecoCat] = data;
    ecoData = data;
    updateFetchedLabel();
    renderEconomy();
  } catch (e) {
    box.innerHTML = '<div class="eco-state">❌ 行情加载失败，请稍后重试（' + esc(e.message) + '）</div>';
  }
}

function updateFetchedLabel() {
  const el = document.getElementById('eco-fetched');
  if (ecoData && ecoData.fetched_at) {
    const t = new Date(ecoData.fetched_at * 1000);
    el.textContent = ' · 更新于 ' + t.toLocaleString('zh-CN', { hour12: false });
  } else el.textContent = '';
}

function toggleEcoFavOnly() {
  ecoFavOnly = !ecoFavOnly;
  document.getElementById('eco-fav-toggle').classList.toggle('active', ecoFavOnly);
  renderEconomy();
}

function toggleEcoFav(name) {
  const favs = ecoFavs();
  if (favs.has(name)) favs.delete(name); else favs.add(name);
  ecoSaveFavs(favs);
  renderEconomy();
}

// 点击表头：同列切换升/降序，换列默认降序
function ecoSortBy(key) {
  if (ecoSort.key === key) ecoSort.dir = ecoSort.dir === 'desc' ? 'asc' : 'desc';
  else { ecoSort.key = key; ecoSort.dir = 'desc'; }
  renderEconomy();
}

function sparkSvg(path, up) {
  if (!path) return '';
  const color = up ? '#6fcf6f' : '#f0808a';
  return '<svg class="eco-spark" viewBox="0 0 60 22" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="' + esc(path) + '" fill="none" stroke="' + color + '" stroke-width="2"/></svg>';
}

function arrowFor(key) {
  if (ecoSort.key !== key) return '<span class="arrow">⇅</span>';
  return '<span class="arrow">' + (ecoSort.dir === 'desc' ? '↓' : '↑') + '</span>';
}

// 计价货币分组顺序（神圣石价值最高，置顶；其余按出现顺序）
const REF_ORDER = ['神圣石', '崇高石', '混沌石'];

function sortRows(rows) {
  const trendVal = r => (r.trendUp ? 1 : -1) * Math.abs(parseNum(r.trendPct));
  const k = ecoSort.key, asc = ecoSort.dir === 'asc';
  if (k === 'price') rows.sort((a, b) => (parseNum(a.qty) - parseNum(b.qty)) * (asc ? 1 : -1));
  else if (k === 'trend') rows.sort((a, b) => (trendVal(a) - trendVal(b)) * (asc ? 1 : -1));
  else if (k === 'vol') rows.sort((a, b) => (parseNum(a.volume) - parseNum(b.volume)) * (asc ? 1 : -1));
  return rows;
}

function groupTable(label, rows) {
  const favs = ecoFavs();
  const k = ecoSort.key;
  let html = '<div class="eco-group-title"><span class="eco-group-coin">' + esc(label) + '</span> 计价 · <span class="eco-group-cnt">' + rows.length + ' 项</span></div>'
    + '<div class="eco-scroll"><table class="eco-table"><thead><tr>'
    + '<th class="col-fav"></th><th class="col-name">名称</th>'
    + '<th class="col-num sortable' + (k === 'price' ? ' sort-active' : '') + '" onclick="ecoSortBy(\'price\')">价格' + arrowFor('price') + '</th>'
    + '<th class="col-spark">近7天</th>'
    + '<th class="col-num sortable' + (k === 'trend' ? ' sort-active' : '') + '" onclick="ecoSortBy(\'trend\')">涨跌' + arrowFor('trend') + '</th>'
    + '<th class="col-num sortable' + (k === 'vol' ? ' sort-active' : '') + '" onclick="ecoSortBy(\'vol\')">24h成交量' + arrowFor('vol') + '</th>'
    + '</tr></thead><tbody>';
  rows.forEach(r => {
    const fav = favs.has(r.name);
    const trendCls = r.trendUp ? 'eco-up' : 'eco-down';
    const arrow = r.trendUp ? '▲' : '▼';
    html += '<tr>'
      + '<td class="col-fav"><button class="eco-fav' + (fav ? ' on' : '') + '" title="收藏" data-fav="' + esc(r.name) + '">⭐</button></td>'
      + '<td class="col-name"><div class="eco-name">' + (r.icon ? '<img class="eco-icon" src="' + esc(r.icon) + '" alt="" loading="lazy">' : '') + '<span class="eco-itemname">' + esc(r.name) + '</span></div></td>'
      + '<td class="col-num eco-price"><span class="num">' + esc(r.qty) + '</span></td>'
      + '<td class="col-spark">' + sparkSvg(r.spark, r.trendUp) + '</td>'
      + '<td class="col-num ' + trendCls + '">' + arrow + ' ' + esc(r.trendPct) + '</td>'
      + '<td class="col-num eco-vol">' + esc(r.volume) + '</td>'
      + '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderEconomy() {
  const box = document.getElementById('eco-content');
  if (!ecoData || !ecoData.items) return;
  const favs = ecoFavs();
  const kw = (document.getElementById('eco-search')?.value || '').trim().toLowerCase().split(/\s+/).filter(Boolean);

  let rows = ecoData.items.slice();
  if (ecoFavOnly) rows = rows.filter(r => favs.has(r.name));
  if (kw.length) rows = rows.filter(r => kw.every(k => r.name.toLowerCase().includes(k)));

  if (!rows.length) { box.innerHTML = '<div class="eco-state">未找到匹配结果</div>'; return; }

  // 按计价货币分组
  const groups = {};
  rows.forEach(r => { (groups[r.refCn] = groups[r.refCn] || []).push(r); });
  const labels = Object.keys(groups).sort((a, b) => {
    const ia = REF_ORDER.indexOf(a), ib = REF_ORDER.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  let html = (ecoData.stale ? '<div class="eco-note">⚠️ 当前为缓存数据，上游暂时不可用，价格可能略有延迟</div>' : '');
  // 只有一种计价时不显示分组标题
  if (labels.length === 1) {
    html += groupTable(labels[0], sortRows(groups[labels[0]]));
  } else {
    labels.forEach(label => { html += groupTable(label, sortRows(groups[label])); });
  }
  box.innerHTML = html;
  box.querySelectorAll('.eco-fav').forEach(btn => {
    btn.addEventListener('click', () => toggleEcoFav(btn.dataset.fav));
  });
}

document.addEventListener('DOMContentLoaded', () => {
  renderCatTabs();
  loadEconomy();
});
</script>
