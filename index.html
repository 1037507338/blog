/* ===== 全部样式内联（原 css/style.css，省一次 RTT） ===== */
:root{--bg-start:#f5f5f5;--bg-end:#f0f0f0;--card-bg:rgba(255,255,255,0.95);--card-border:rgba(220,220,220,0.5);--card-shadow:0 1px 2px 0 rgba(0,0,0,0.05);--card-shadow-hover:0 3px 6px -1px rgba(0,0,0,0.1);--text:#333;--subtext:#666;--accent:#555;--link:#555;--link-hover:#000;--btn-bg:rgba(255,255,255,.9);--btn-bg-hover:rgba(255,255,255,1);--btn-icon:#555;--btn-shadow:0 1px 3px rgba(0,0,0,.05);--btn-shadow-hover:0 2px 5px rgba(0,0,0,.08);--nav-bg:rgba(255,255,255,0.92);--nav-border:rgba(220,220,220,0.6);--nav-link:#555;--nav-link-hover:#000;--nav-active:#1a73e8}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(145deg,var(--bg-start) 0%,var(--bg-end) 100%);color:var(--text);line-height:1.6;min-height:100vh;transition:background .3s ease,color .3s ease;overflow-y:scroll}
html{scroll-behavior:smooth}
.site-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--nav-border);height:48px;transition:background .3s ease,border-color .3s ease}

.search-container.compact{max-width:1400px;margin:64px auto 0;padding:0 1.5rem;position:relative;display:flex;flex-direction:column}

.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--subtext);cursor:pointer;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:color .2s,opacity .2s,visibility .2s;width:24px;height:24px;z-index:10;outline:none;opacity:0;visibility:hidden}

main{max-width:1400px;margin:0 auto;padding:0 1.5rem 2rem;min-height:300px}

[data-theme="dark"] section h2{background:linear-gradient(135deg,rgba(91,163,245,.12),rgba(91,163,245,.04))}

li:hover{box-shadow:var(--card-shadow-hover);border-color:var(--accent);transform:translateY(-2px)}

li a:hover{color:var(--link-hover)}
.favicon-container{width:24px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-start}
body.hide-favicon .favicon-container{display:none}
.favicon{width:16px;height:16px;border-radius:2px;opacity:0;transition:opacity .3s;display:block}
.favicon.loaded{opacity:1}
.link-text{flex:1;min-width:0;word-break:break-word}
li .url{margin-top:.5rem;font-size:.75rem;color:var(--subtext);word-break:break-all;line-height:1.4;position:relative;z-index:2;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.05)}

/* ===== 国服倒计时横幅（紧贴 nav，单行紧凑） ===== */

.poe2-countdown{max-width:1400px;margin:56px auto 0;padding:0 1.5rem}

.poe2-countdown-inner{display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:10px;background:linear-gradient(135deg,rgba(201,162,39,.12),rgba(139,105,20,.08));border:1px solid rgba(201,162,39,.32);box-shadow:0 1px 3px rgba(0,0,0,.04)}
[data-theme="dark"] .poe2-countdown-inner{background:linear-gradient(135deg,rgba(201,162,39,.15),rgba(139,105,20,.1));border-color:rgba(201,162,39,.4)}
.poe2-countdown-icon{font-size:1.1rem;line-height:1;flex-shrink:0;filter:drop-shadow(0 0 4px rgba(201,162,39,.5))}

.poe2-countdown-title{font-size:.85rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.poe2-countdown-title .badge{display:inline-block;padding:1px 6px;font-size:.66rem;font-weight:700;background:linear-gradient(135deg,#c9a227,#8b6914);color:#fff;border-radius:4px;margin-right:6px;vertical-align:1px;letter-spacing:.3px}
.poe2-countdown-meta{font-size:.72rem;color:var(--subtext);display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex-shrink:0}
.poe2-countdown-sep{opacity:.5}
.poe2-countdown-timer{flex-shrink:0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.92rem;font-weight:700;color:#c9a227;background:rgba(201,162,39,.1);padding:4px 10px;border-radius:6px;border:1px solid rgba(201,162,39,.25);letter-spacing:.5px;line-height:1.25;text-align:center}
[data-theme="dark"] .poe2-countdown-timer{background:rgba(201,162,39,.15)}
@media(max-width:768px){
  .poe2-countdown{padding:0 1rem;margin-top:54px}

}
@media(max-width:480px){
  body.has-poe2-countdown .search-container.compact{margin:10px 1rem 1.2rem !important;padding:0}
}

/* ============================================================ */
/* ===== 重设计：流放者编年史（Exile's Compendium）羊皮卷主题 ===== */
/* ============================================================ */
:root{
  --ink-900:#0d0a07;--ink-800:#14100c;--ink-700:#1d1812;--ink-600:#2a221a;--ink-500:#3a2f23;
  --gold-100:#f6e6b0;--gold-200:#e8c970;--gold-400:#c9a227;--gold-600:#8b6914;
  --parchment:#ede1c8;--parchment-muted:#a89c80;--parchment-faint:#6e6557;
  --crimson:#8b2e2e;
  --font-display:'Cinzel','Noto Serif SC',serif;
  --font-body:'Cormorant Garamond','Noto Serif SC',Georgia,serif;
  --font-zh:'Noto Serif SC','Cormorant Garamond',serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
}
body[data-theme="light"]{
  --ink-900:#fffaef;--ink-800:#faf2dd;--ink-700:#f3e9cf;--ink-600:#ebdfb9;--ink-500:#d6c79c;
  --parchment:#2a1d0e;--parchment-muted:#5c4a2e;--parchment-faint:#8a7755;
}
body{
  font-family:var(--font-zh);
  font-size:16px;font-weight:400;line-height:1.6;
  background:var(--ink-800)!important;color:var(--parchment);
  -webkit-font-smoothing:antialiased;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%,rgba(201,162,39,0.06),transparent 70%),
    radial-gradient(ellipse 100% 60% at 50% 100%,rgba(0,0,0,0.6),transparent 70%);
}
body[data-theme="light"]::before{
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%,rgba(201,162,39,0.10),transparent 70%),
    radial-gradient(ellipse 100% 60% at 50% 100%,rgba(139,105,20,0.08),transparent 70%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  opacity:0.05;mix-blend-mode:overlay;
}
body>*{position:relative;z-index:1;}

/* ====== NAV 重设计 ====== */
.site-nav{
  background:rgba(13,10,7,0.85)!important;
  backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid var(--ink-500)!important;
  height:56px;
}
body[data-theme="light"] .site-nav{background:rgba(250,242,221,0.88)!important;}
.site-nav-logo{
  font-family:var(--font-zh)!important;font-size:1rem;font-weight:600;
  letter-spacing:0.06em;color:var(--gold-200)!important;
}
.logo-icon{font-size:1.15rem;background:linear-gradient(135deg,var(--gold-200),var(--gold-600))!important;-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.site-nav-link{
  font-family:var(--font-zh)!important;font-size:0.92rem;font-weight:500;
  letter-spacing:0.08em;
  color:var(--parchment-muted)!important;padding:7px 14px!important;border-radius:0!important;
  position:relative;transition:color 0.3s;
}
.site-nav-link:hover{color:var(--gold-200)!important;background:transparent!important;}
.site-nav-link.active{color:var(--gold-200)!important;background:transparent!important;font-weight:600;}
.site-nav-link.active::after{
  content:'';position:absolute;left:50%;bottom:-1px;width:28px;height:2px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--gold-400),transparent);
}

/* ====== HERO（精简版：直接放倒计时和搜索，无大标题） ====== */
.hero{
  padding:78px 1.5rem 12px;text-align:center;
  max-width:760px;margin:0 auto;
}

/* ====== RITUAL · 倒计时祭坛（缩小） ====== */
.ritual{
  position:relative;max-width:520px;margin:0 auto 28px;
  padding:24px 28px 18px;
  background:
    linear-gradient(135deg,rgba(201,162,39,0.04) 0%,rgba(139,105,20,0.08) 100%),
    var(--ink-700);
  border:1px solid rgba(201,162,39,0.22);
  box-shadow:inset 0 0 60px rgba(201,162,39,0.04),0 20px 40px -20px rgba(0,0,0,0.5);
}
body[data-theme="light"] .ritual{
  background:linear-gradient(135deg,rgba(201,162,39,0.05),rgba(139,105,20,0.03)),var(--ink-700);
}
.ritual-corner{position:absolute;width:22px;height:22px;pointer-events:none;}
.ritual-corner-tl{top:-1px;left:-1px;border-top:1.5px solid var(--gold-400);border-left:1.5px solid var(--gold-400);}
.ritual-corner-tr{top:-1px;right:-1px;border-top:1.5px solid var(--gold-400);border-right:1.5px solid var(--gold-400);}
.ritual-corner-bl{bottom:-1px;left:-1px;border-bottom:1.5px solid var(--gold-400);border-left:1.5px solid var(--gold-400);}
.ritual-corner-br{bottom:-1px;right:-1px;border-bottom:1.5px solid var(--gold-400);border-right:1.5px solid var(--gold-400);}
.ritual-label{
  display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:var(--font-zh);font-size:0.78rem;font-weight:500;
  letter-spacing:0.32em;color:var(--gold-400);margin-bottom:12px;
}
.ritual-label-mark{font-size:0.55rem;color:var(--gold-600);}
.ritual-name{
  font-family:var(--font-zh);font-size:1.2rem;font-weight:500;
  color:var(--parchment);letter-spacing:0.06em;margin-bottom:18px;
}
.ritual-timer{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px;}
.ritual-block{
  padding:12px 4px 10px;background:rgba(0,0,0,0.55);
  border:1px solid rgba(201,162,39,0.28);

<body>

<main id="nav-container">

<footer>
  <small>© 2025 POE2 国服攻略站 · 数据来源 <a href="https://www.poe2wiki.net" target="_blank">POE2 Wiki</a> · 仅供学习交流</small>

<script>
// ===== 全部脚本内联（原 js/nav.js，省一次 RTT） =====
let allLinks = [];

async function loadLinks() {
  const navContainer = document.getElementById('nav-container');
  if (!navContainer) return;
  try {
    // 复用 head 里提前发起的请求，几乎 0 等待
    const data = window.__linksReq ? await window.__linksReq : await fetch('/api/links').then(r=>r.json());
    allLinks = (data || []).filter(l => l.page_type === '首页导航');
    render(allLinks);
  } catch (e) {
    navContainer.innerHTML = '<div class="error-message"><p>😢 加载链接失败: ' + e.message + '</p><button onclick="location.reload()">重试</button></div>';
  }
}

function render(list) {
  const wrap = document.getElementById('nav-container');
  if (!wrap) return;
  const group = {};
  for (let i = 0; i < list.length; i++) {
    const item = list[i];
    const cats = item.categories;
    const cat = (Array.isArray(cats) && cats.length) ? cats[0] : (item.category || '未分类');
    if (!group[cat]) group[cat] = [];
    group[cat].push(item);
  }
  const sections = [];
  for (const category in group) {
    const links = group[category];
    sections.push('<section><h2>', escapeHtml(category), '</h2><ul>');
    for (let i = 0; i < links.length; i++) {
      const link = links[i];
      sections.push(
        '<li data-url="', link.url, '" data-id="', link.id, '">',
        '<a href="', link.url, '" target="_blank" rel="noopener" class="card-title">',
        '<div class="favicon-container"><img class="favicon" src="" alt=""></div>',
        '<span class="link-text">', escapeHtml(link.title), '</span>',
        '</a>',
        '<div class="url">', escapeHtml(link.description || ''), '</div>',
        '</li>'
      );
    }
    sections.push('</ul></section>');
  }
  wrap.innerHTML = sections.join('');
  wrap.addEventListener('click', handleCardClick);
  loadFavicons();
}

function handleCardClick(e) {
  const card = e.target.closest('li[data-url]');
  if (!card) return;
  if (e.target.closest('a')) { e.preventDefault(); e.stopPropagation(); }
  window.open(card.dataset.url, '_blank');
}

function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

function setupSearch() {
  const searchInput = document.getElementById('search-input');
  const searchClear = document.getElementById('search-clear');
  const searchResultsCount = document.getElementById('search-results-count');
  if (!searchInput) return;
  let searchTimeout;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    const v = searchInput.value;
    if (v.length > 0) searchClear.classList.add('visible'); else searchClear.classList.remove('visible');
    searchTimeout = setTimeout(() => {
      const q = v.trim().toLowerCase();
      if (q === '') { render(allLinks); searchResultsCount.classList.remove('visible'); return; }
      const filtered = allLinks.filter(link =>
        (link.title||'').toLowerCase().includes(q) ||
        (link.description||'').toLowerCase().includes(q) ||
        (link.url||'').toLowerCase().includes(q) ||
        (link.category||'').toLowerCase().includes(q) ||
        ((Array.isArray(link.categories) && link.categories.length && link.categories.some(c=>c.toLowerCase().includes(q))))
      );
      render(filtered);
      searchResultsCount.textContent = `找到 ${filtered.length} 个结果`;
      searchResultsCount.classList.add('visible');
    }, 50);
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = ''; searchInput.focus();
    render(allLinks);
    searchResultsCount.classList.remove('visible');
    searchClear.classList.remove('visible');
  });
}

// ===== Favicon 懒加载（国内可用源 → 备用 → emoji 兜底） =====
function loadFavicons() {
  const els = document.querySelectorAll('.card-title[href] .favicon');
  if (!('IntersectionObserver' in window)) {
    els.forEach(img => { const a=img.closest('.card-title'); const d=a?extractDomain(a.getAttribute('href')):null; if(d)tryLoadFavicon(img,d); });
    return;
  }
  const io = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const img = entry.target; obs.unobserve(img);
      const a = img.closest('.card-title');
      const domain = a ? extractDomain(a.getAttribute('href')) : null;
      if (domain) tryLoadFavicon(img, domain);
    });
  }, { rootMargin: '200px' });
  els.forEach(img => io.observe(img));
}

function tryLoadFavicon(faviconImg, domain) {
  const sources = [
    `https://icon.horse/icon/${domain}`,
    `https://favicon.im/${domain}?larger=true`,
    `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=32`
  ];
  let idx = 0, done = false;
  const timer = setTimeout(() => { if (done) return; done = true; showEmojiIcon(faviconImg); }, 4000);
  function attempt() {
    if (done) return;
    if (idx >= sources.length) { done = true; clearTimeout(timer); showEmojiIcon(faviconImg); return; }
    const url = sources[idx++];
    const img = new Image();
    img.onload = () => {
      if (done) return;
      if (img.naturalWidth <= 1 && img.naturalHeight <= 1) { attempt(); return; }
      done = true; clearTimeout(timer);
      faviconImg.src = url; faviconImg.classList.add('loaded');
    };
    img.onerror = () => attempt();
    img.src = url;
  }
  attempt();
}
function showEmojiIcon(faviconImg) {
  const c = document.createElement('canvas'); c.width=16; c.height=16;
  const ctx = c.getContext('2d'); ctx.font='12px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🌐',8,8); faviconImg.src=c.toDataURL(); faviconImg.classList.add('loaded');
}
function extractDomain(url) {
  try { return new URL(url.startsWith('http')?url:'https://'+url).hostname; }
  catch(e) { const m=url.match(/^(?:https?:\/\/)?(?:www\.)?([^\/?#]+)/); return m?m[1]:null; }
}

// ===== 初始化（HTML 已 parsed，可直接执行）=====
(function init(){
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) document.body.setAttribute('data-theme', savedTheme);
  else document.body.setAttribute('data-theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  const themeToggleBtn = document.getElementById('theme-toggle');
  const sun = themeToggleBtn?.querySelector('.theme-sun');
  const moon = themeToggleBtn?.querySelector('.theme-moon');
  function updateThemeIcon(t){ if(sun)sun.style.display=t==='dark'?'none':'block'; if(moon)moon.style.display=t==='dark'?'block':'none'; }
  updateThemeIcon(document.body.getAttribute('data-theme'));
  if (themeToggleBtn) themeToggleBtn.onclick = () => {
    const cur = document.body.getAttribute('data-theme')==='dark'?'light':'dark';
    document.body.setAttribute('data-theme', cur);
    localStorage.setItem('theme', cur);
    updateThemeIcon(cur);
  };

  const btt = document.getElementById('back-to-top');
  if (btt) {
    btt.onclick = () => window.scrollTo({top:0,behavior:'smooth'});
    window.addEventListener('scroll', () => btt.classList.toggle('visible', scrollY > 300));
  }

  const nt = document.getElementById('navToggle');
  const nl = document.querySelector('.site-nav-links');
  if (nt && nl) {
    nt.onclick = () => { nl.classList.toggle('open'); nt.classList.toggle('active'); };
    nl.querySelectorAll('.site-nav-link').forEach(a => a.onclick = () => { nl.classList.remove('open'); nt.classList.remove('active'); });
  }

  const path = location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.site-nav-link').forEach(a => { if (a.getAttribute('href')===path) a.classList.add('active'); });

  loadLinks();
  setupSearch();
  setupPoe2Countdown();
})();

// ===== 国服倒计时 =====
async function setupPoe2Countdown() {
  let cfg = {};
  try { cfg = await window.__configReq; } catch(e) { cfg = {}; }
  if (!cfg || !cfg.poe2_cn_countdown) return;

  // 配置开启 → 立刻发起 poe2-time 请求（与下面 DOM 操作并行）
  if (!window.__poe2TimeReq) window.__poe2TimeReq = fetch('/api/poe2-time').then(r => r.ok ? r.json() : null).catch(() => null);

  const data = await window.__poe2TimeReq;
  if (!data || !data.cn) return;
  renderPoe2Countdown(data.cn);
}

function renderPoe2Countdown(target) {
  const box = document.getElementById('poe2-countdown');
  if (!box) return;
  const ts = target.timestamp * 1000;
  const date = new Date(ts);
  const isUpcoming = target.status === 'upcoming';

  document.getElementById('poe2cd-status').textContent = isUpcoming ? '国服赛季倒计时' : '当前赛季已运行';
  document.getElementById('poe2cd-title').textContent = target.name;
  document.getElementById('poe2cd-date').textContent = date.toLocaleString('zh-CN', {
    year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false
  });

  box.style.display = 'block';
  document.body.classList.add('has-poe2-countdown');

  const segs = {
    d: box.querySelector('[data-seg="d"]'),
    h: box.querySelector('[data-seg="h"]'),
    m: box.querySelector('[data-seg="m"]'),
    s: box.querySelector('[data-seg="s"]'),
  };
  const pad = n => String(Math.max(0, n)).padStart(2, '0');

  function tick() {
    const diff = isUpcoming ? (ts - Date.now()) : (Date.now() - ts);
    const total = Math.max(0, Math.floor(diff / 1000));
    const d = Math.floor(total / 86400);
    const h = Math.floor((total % 86400) / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    segs.d.textContent = String(d).padStart(2, '0');
    segs.h.textContent = pad(h);
    segs.m.textContent = pad(m);
    segs.s.textContent = pad(s);
  }
  tick();
  setInterval(tick, 1000);
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
</script>
