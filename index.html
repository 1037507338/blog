<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title>My Blog - 主页</title>
    <meta name="description" content="一个专注于 Java 后端开发与前沿技术的个人博客">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta http-equiv="Window-target" content="_top">
    <link rel="shortcut icon" href="./blog/amaze/images/compass.png">
    <link rel="stylesheet" href="./X-admin/css/font.css">
    <link rel="stylesheet" href="./blog/amaze/css/base.css">
</head>
<body id="blog">

<!-- 导航栏 -->
<nav class="navbar navbar-default navbar-custom navbar-fixed-top">
    <div class="container-fluid">
        <div class="navbar-header page-scroll">
            <button type="button" class="navbar-toggle" id="navbar-toggle">
                <span class="sr-only"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="./index.html" id="brandName">My Blog</a>
        </div>
        <div class="navbar-collapse" style="display: none" id="toggle-items">
            <ul class="nav navbar-nav navbar-right">
                <li><a href="./index.html">主页</a></li>
                <li><a href="./link.html">友链</a></li>
                <li><a href="./detail.html?id=1">关于</a></li>
                <li><a href="https://github.com/1037507338">GitHub</a></li>
            </ul>
        </div>
        <div id="huxblog_navbar">
            <div class="navbar-collapse">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="./index.html">主页</a></li>
                    <li><a href="./link.html">友链</a></li>
                    <li><a href="./detail.html?id=1">关于</a></li>
                    <li><a href="https://github.com/1037507338">GitHub</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- 头部 Banner -->
<header class="intro-header" style="background-image:url('./blog/amaze/images/header.jpg');">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
                <div class="site-heading">
                    <span class="subheading">一晃两三年，匆匆又夏天</span>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="am-g am-g-fixed blog-fixed">
    <!-- 文章列表 -->
    <div class="am-u-lg-8 am-u-sm-12">
        <main class="articles-list">
            <div id="articleContainer"></div>
            <div id="page" style="text-align:center;margin:30px 0;"></div>
        </main>
    </div>

    <!-- 侧边栏 -->
    <div class="am-u-lg-4 am-u-sm-12 am-u-lg-offset-0 am-u-sm-offset-0 sidebar-container">
        <section>
            <section>
                <div class="sidebar-header">
                    <span class="sidebar-header-title">搜索文章</span>
                </div>
                <div class="sidebar-search">
                    <form method="get" onsubmit="return false;" accept-charset="utf-8">
                        <div class="search-input">
                            <input type="text" name="keyword" id="searchbox" autocomplete="off" placeholder="输入关键字搜索">
                            <button type="submit" class="search-submit" onclick="doSearch()"></button>
                        </div>
                    </form>
                </div>
            </section>
            <section>
                <div class="sidebar-header">
                    <span class="sidebar-header-title">热门标签</span>
                </div>
                <div class="tags" id="hotTags"></div>
            </section>
            <section>
                <div class="sidebar-header">
                    <span class="sidebar-header-title">最新发布</span>
                </div>
                <div class="sidebar-list">
                    <ul class="sidebar-list-body sidebar-list-items" id="newBlogs"></ul>
                </div>
            </section>
            <section>
                <div class="sidebar-header">
                    <span class="sidebar-header-title">点击最多</span>
                </div>
                <main class="sidebar-lists">
                    <ul id="hotBlogs"></ul>
                </main>
            </section>
        </section>
    </div>
</div>

<!-- 页脚 -->
<footer class="footer blog-footer">
    <div class="blog-text-center">
        &copy; <span id="footerAuthor">博主</span>
        <span class="ft-warn">&heartsuit;</span>&nbsp;site blog
        <a>京ICP备2021003785号</a><br>
        Powered by <a href="#" target="_blank" id="footerCopyright">2024 My Blog</a>
    </div>
</footer>

<script src="./blog/plugins/jquery/jquery.min.js"></script>
<script src="./blog/plugins/search/search.js"></script>
<script>
(function() {
    var allData = null;
    var currentPage = 1;
    var pageSize = 5;
    var keyword = '';

    // URL参数解析
    function getQueryParam(name) {
        var params = new URLSearchParams(window.location.search);
        return params.get(name);
    }

    // 加载数据
    $.getJSON('./data.json', function(data) {
        allData = data;
        initPage();
        initSidebar();
    }).fail(function() {
        $('#articleContainer').html('<p style="text-align:center;padding:50px;">数据加载失败，请刷新页面重试</p>');
    });

    function initPage() {
        keyword = getQueryParam('keyword') || '';
        if (keyword) {
            $('#searchbox').val(keyword);
        }
        renderPage(1);
    }

    function initSidebar() {
        // 热门标签
        var tagsHtml = '';
        var hotTags = allData.hotTags || [];
        for (var i = 0; i < hotTags.length; i++) {
            var t = hotTags[i];
            tagsHtml += '<a rel="tag" href="./list.html?tagId=' + t.tagId + '">' + t.tagName + '(' + t.tagCount + ')</a>';
        }
        $('#hotTags').html(tagsHtml);

        // 最新发布（按时间倒序前5）
        var sorted = allData.blogs.slice().sort(function(a, b) {
            return b.createTime.localeCompare(a.createTime);
        });
        var newHtml = '';
        for (var i = 0; i < Math.min(5, sorted.length); i++) {
            var b = sorted[i];
            newHtml += '<li class="sidebar-list-item"><a href="./detail.html?id=' + b.blogId + '" class="tag tooltipped tooltipped-n">' + b.blogTitle + '</a></li>';
        }
        $('#newBlogs').html(newHtml);

        // 点击最多（按浏览数倒序前5）
        var hotSorted = allData.blogs.slice().sort(function(a, b) { return b.blogViews - a.blogViews; });
        var hotHtml = '';
        for (var i = 0; i < Math.min(5, hotSorted.length); i++) {
            var b = hotSorted[i];
            hotHtml += '<li class="sidebar-list-item"><a href="./detail.html?id=' + b.blogId + '" class="tag tooltipped tooltipped-n">' + b.blogTitle + '</a></li>';
        }
        $('#hotBlogs').html(hotHtml);

        // 页脚
        $('#footerAuthor').text(allData.config.sysAuthor);
        $('#footerCopyright').text(allData.config.sysCopyRight);
        $('#brandName').text(allData.config.websiteName);
        document.title = allData.config.websiteName + ' - 主页';
    }

    function getFilteredBlogs() {
        var blogs = allData.blogs;
        if (keyword) {
            var kw = keyword.toLowerCase();
            blogs = blogs.filter(function(b) {
                return b.blogTitle.toLowerCase().indexOf(kw) > -1 ||
                       b.blogPreface.toLowerCase().indexOf(kw) > -1 ||
                       (b.blogCategoryName && b.blogCategoryName.toLowerCase().indexOf(kw) > -1);
            });
        }
        return blogs;
    }

    function renderPage(page) {
        currentPage = page;
        var filtered = getFilteredBlogs();
        var total = filtered.length;
        var totalPages = Math.ceil(total / pageSize);
        var start = (page - 1) * pageSize;
        var end = Math.min(start + pageSize, total);
        var pageBlogs = filtered.slice(start, end);

        var html = '';
        for (var i = 0; i < pageBlogs.length; i++) {
            var blog = pageBlogs[i];
            html += '<article class="am-g blog-entry-article">' +
                '<div class="am-u-lg-6 am-u-lg-12 am-u-sm-12 blog-entry-text post-preview">' +
                '<div class="topic-header">' +
                '<div class="pull-left">' +
                '<div class="blog-flex-center">' +
                '<div class="blog-flex0">' +
                '<img src="' + allData.config.sysAuthorImg + '" alt="" class="link avatar avatar-image">' +
                '</div>' +
                '<div class="author-lockup blog-flex1">' +
                '<a class="link" href="javascript:;">' + allData.config.sysAuthor + '</a>' +
                '<span class="in">in</span>' +
                '<span class="category-name">' +
                '<a class="category-name" rel="tag" href="./list.html?categoryName=' + encodeURIComponent(blog.blogCategoryName || '') + '">' + (blog.blogCategoryName || '') + '</a>' +
                '</span>' +
                '</div>' +
                '</div>' +
                '</div>' +
                '<span class="pull-right time pc_time">' + blog.createTime + '</span>' +
                '</div>' +
                '<h1 class="post-index-title"><a itemtype="url" href="./detail.html?id=' + blog.blogId + '">' + blog.blogTitle + '</a></h1>' +
                '<div class="abstract vditor-reset"><p>' + blog.blogPreface + '</p></div>' +
                '</div>' +
                '</article>';
        }

        if (html === '') {
            html = '<p style="text-align:center;padding:50px;color:#999;">暂无文章</p>';
        }
        $('#articleContainer').html(html);

        // 分页按钮
        var pageHtml = '';
        if (totalPages > 1) {
            pageHtml += '<div class="layui-box layui-laypage layui-laypage-default">';
            if (page > 1) {
                pageHtml += '<a href="javascript:;" class="layui-laypage-prev" data-page="' + (page - 1) + '">上一页</a>';
            }
            for (var p = 1; p <= totalPages; p++) {
                if (p === page) {
                    pageHtml += '<span class="layui-laypage-curr"><em class="layui-laypage-em"></em><em>' + p + '</em></span>';
                } else {
                    pageHtml += '<a href="javascript:;" data-page="' + p + '">' + p + '</a>';
                }
            }
            if (page < totalPages) {
                pageHtml += '<a href="javascript:;" class="layui-laypage-next" data-page="' + (page + 1) + '">下一页</a>';
            }
            pageHtml += '</div>';
        }
        $('#page').html(pageHtml);

        // 分页点击事件
        $('#page a').click(function() {
            var p = parseInt($(this).data('page'));
            if (p) {
                renderPage(p);
                $('html, body').animate({scrollTop: 0}, 300);
            }
        });
    }

    // 搜索
    window.doSearch = function() {
        keyword = $('#searchbox').val().trim();
        currentPage = 1;
        renderPage(1);
    };

    // 回车搜索
    $('#searchbox').on('keydown', function(e) {
        if (e.key === 'Enter') {
            doSearch();
        }
    });

    // 导航切换
    $('#navbar-toggle').click(function() {
        $('#toggle-items').fadeToggle('fast');
    });

    // 返回顶部
    $(window).scroll(function() {
        if ($(this).scrollTop() > 300) {
            $('#back-top').fadeIn();
        } else {
            $('#back-top').fadeOut();
        }
    });
})();
</script>
</body>
</html>
