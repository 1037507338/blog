<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BD推荐 - POE2 Hub</title>
<meta name="description" content="流放之路2当前版本T0/T1热门BD推荐">
<style>
:root{
  --bg:#f5f5f5;--card:#fff;--card2:#fafafa;--border:#e8e8e8;--border2:#ddd;
  --text:#1a1a1a;--text2:#555;--text3:#888;--accent:#1a73e8;
  --gold:#c9a227;--gold2:#f0d060;--gold-bg:rgba(201,162,39,.07);
  --shadow:0 2px 8px rgba(0,0,0,.06);--shadow2:0 6px 24px rgba(0,0,0,.12);
  --radius:14px;--radius2:10px;
}
[data-theme="dark"]{
  --bg:#1a1a1a;--card:#252525;--card2:#2d2d2d;--border:#383838;--border2:#444;
  --text:#e8e8e8;--text2:#aaa;--text3:#777;--accent:#5ba3f5;
  --gold:#c9a227;--gold2:#f0d060;--gold-bg:rgba(201,162,39,.1);
  --shadow:0 2px 8px rgba(0,0,0,.3);--shadow2:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;
  transition:background .3s,color .3s;
}
a{text-decoration:none;color:inherit}

/* ===== 导航 ===== */
.site-nav{
  position:fixed;top:0;left:0;right:0;z-index:500;
  background:var(--card);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);height:52px;
  display:flex;align-items:center;
}
.site-nav-inner{
  max-width:1200px;width:100%;margin:0 auto;padding:0 1.5rem;
  display:flex;align-items:center;gap:1.5rem;
}
.site-nav-logo{font-size:1rem;font-weight:800;color:var(--text);white-space:nowrap;flex-shrink:0}
.logo-icon{background:linear-gradient(135deg,var(--gold),#8b6914);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.site-nav-links{display:flex;gap:2px;align-items:center;flex:1}
.site-nav-link{
  padding:5px 10px;border-radius:6px;font-size:.87rem;color:var(--text2);
  transition:.2s;white-space:nowrap;
}
.site-nav-link:hover{background:rgba(128,128,128,.06);color:var(--text)}
.site-nav-link.active{color:var(--accent);font-weight:600;background:rgba(26,115,232,.07)}
.site-nav-toggle{
  display:none;flex-direction:column;gap:4px;padding:6px;border:none;
  background:transparent;cursor:pointer;border-radius:6px;margin-left:auto;
}
.site-nav-toggle span{width:20px;height:2px;background:var(--text2);border-radius:2px;transition:.2s}

/* ===== 主题切换 ===== */
#theme-toggle{
  position:fixed;top:12px;right:1.5rem;z-index:600;
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--border);background:var(--card);
  color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.2s;box-shadow:var(--shadow);
}
#theme-toggle:hover{border-color:var(--accent);color:var(--accent)}

/* ===== 页面主体 ===== */
.page-wrap{max-width:1100px;margin:0 auto;padding:72px 1.5rem 3rem}
.page-header{margin-bottom:2rem}
.page-title{
  font-size:1.6rem;font-weight:800;margin-bottom:.4rem;
  background:linear-gradient(135deg,var(--text) 50%,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.page-desc{font-size:.9rem;color:var(--text3)}

/* ===== 分类筛选 ===== */
.bd-filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center}
.filter-btn{
  padding:5px 14px;border-radius:20px;font-size:.8rem;font-weight:500;
  border:1px solid var(--border);background:var(--card);color:var(--text2);
  cursor:pointer;transition:.2s;
}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}

/* ===== BD 卡片网格 ===== */
.bd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

.bd-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);transition:box-shadow .25s,border-color .25s,transform .25s;
  display:flex;flex-direction:column;
  cursor:pointer;
}
.bd-card:hover{
  box-shadow:var(--shadow2);border-color:var(--accent);
  transform:translateY(-2px);
}

/* 卡片顶部渐变条 */
.bd-card-accent{
  height:5px;
  background:linear-gradient(90deg,var(--gold) 0%,var(--gold2) 100%);
}

/* 卡片内容 */
.bd-card-inner{
  padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;flex:1;
}

/* 头部：图标 + 标题 */
.bd-card-header{display:flex;align-items:flex-start;gap:12px}
.bd-card-icon{
  width:44px;height:44px;border-radius:10px;flex-shrink:0;
  background:var(--gold-bg);border:1px solid rgba(201,162,39,.2);
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;
}
.bd-card-title{
  font-size:1rem;font-weight:700;line-height:1.35;color:var(--text);
}
.bd-card-sub{
  font-size:.78rem;color:var(--text3);margin-top:2px;
}

/* 描述 */
.bd-card-desc{
  font-size:.85rem;color:var(--text2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* 分类标签 */
.bd-card-cats{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.bd-cat-chip{
  display:inline-flex;align-items:center;gap:3px;
  padding:3px 9px;border-radius:6px;font-size:.72rem;font-weight:600;
  background:linear-gradient(135deg,rgba(201,162,39,.12),rgba(201,162,39,.06));
  border:1px solid rgba(201,162,39,.25);color:var(--gold);
}

/* 底部操作条 */
.bd-card-footer{
  padding:10px 18px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:flex-end;
  background:var(--card2);
}
.bd-card-type{
  display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--text3);
}
.bd-card-cta{
  font-size:.8rem;font-weight:600;color:var(--accent);
  display:flex;align-items:center;gap:4px;
}
.bd-card:hover .bd-card-cta{text-decoration:underline}

/* 加载/空状态 */
.bd-state{text-align:center;padding:3rem 0;color:var(--text3);font-size:.9rem}

/* ===== 返回顶部 ===== */
#back-to-top{
  position:fixed;bottom:2rem;right:2rem;z-index:400;
  width:40px;height:40px;border-radius:50%;
  background:var(--card);border:1px solid var(--border);
  color:var(--text2);cursor:pointer;font-size:1rem;
  display:none;align-items:center;justify-content:center;
  box-shadow:var(--shadow);transition:.2s;
}
#back-to-top.visible{display:flex}

/* ===== 响应式 ===== */
@media(max-width:768px){
  .site-nav-links{position:fixed;top:52px;left:0;right:0;bottom:0;background:var(--card);flex-direction:column;align-items:flex-start;padding:1rem;gap:4px;display:none;z-index:499}
  .site-nav-links.open{display:flex}
  .site-nav-toggle{display:flex}
  .page-wrap{padding-top:64px}
}
</style>
<link rel="icon" href="favicon.ico">
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a href="index.html" class="site-nav-logo"><span class="logo-icon">⚔</span> POE2 Hub</a>
    <div class="site-nav-links">
      <a href="index.html" class="site-nav-link">首页</a>
      <a href="builds.html" class="site-nav-link active">BD推荐</a>
      <a href="guides.html" class="site-nav-link">新手攻略</a>
      <a href="maps.html" class="site-nav-link">剧情攻略</a>
      <a href="news.html" class="site-nav-link">资讯动态</a>
      <a href="tools.html" class="site-nav-link">工具集</a>
    </div>
    <button class="site-nav-toggle" id="navToggle" aria-label="菜单"><span></span><span></span><span></span></button>
  </div>
</nav>

<button id="theme-toggle" aria-label="切换主题">
  <svg class="theme-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="theme-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
<button id="back-to-top" aria-label="返回顶部">↑</button>

<div class="page-wrap">
  <div class="page-header">
    <h1 class="page-title">⚔️ BD推荐</h1>
    <p class="page-desc">流放之路2 当前版本 T0 / T1 热门 BD，持续更新</p>
  </div>

  <!-- 分类筛选 -->
  <div class="bd-filter-bar" id="bdFilterBar"></div>

  <!-- 卡片网格 -->
  <div class="bd-grid" id="bdGrid">
    <p class="bd-state">加载中...</p>
  </div>
</div>

<script>
const API = '/api/links?page_type=BD推荐';
let allBuilds = [];
let activeCat = '全部';

async function init() {
  const s = localStorage.getItem('theme');
  document.body.setAttribute('data-theme', s || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));

  const t = document.getElementById('theme-toggle');
  if (t) t.onclick = () => {
    const c = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', c);
    localStorage.setItem('theme', c);
  };

  const b = document.getElementById('back-to-top');
  if (b) {
    b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('scroll', () => b.classList.toggle('visible', scrollY > 300));
  }

  const n = document.getElementById('navToggle');
  const l = document.querySelector('.site-nav-links');
  if (n && l) n.addEventListener('click', () => l.classList.toggle('open'));

  await loadBuilds();
}

async function loadBuilds() {
  try {
    const resp = await fetch(API);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    allBuilds = await resp.json();
    renderFilterBar();
    renderCards();
  } catch (e) {
    document.getElementById('bdGrid').innerHTML = `<p class="bd-state">加载失败：${e.message}</p>`;
  }
}

function getAllCats() {
  const cats = {};
  allBuilds.forEach(l => {
    (l.categories || []).forEach(c => { cats[c] = (cats[c] || 0) + 1; });
  });
  return Object.entries(cats).sort((a, b) => b[1] - a[1]);
}

function renderFilterBar() {
  const cats = getAllCats();
  const all = allBuilds.length;
  const el = document.getElementById('bdFilterBar');
  el.innerHTML = [
    `<button class="filter-btn${activeCat === '全部' ? ' active' : ''}" onclick="setCat('全部')">全部 (${all})</button>`,
    ...cats.map(([c, n]) =>
      `<button class="filter-btn${activeCat === c ? ' active' : ''}" onclick="setCat('${escAttr(c)}')">${esc(c)} (${n})</button>`
    )
  ].join('');
}

function setCat(cat) {
  activeCat = cat;
  renderFilterBar();
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('bdGrid');
  let data = allBuilds;
  if (activeCat !== '全部') data = data.filter(l => (l.categories || []).includes(activeCat));
  if (!data.length) { grid.innerHTML = '<p class="bd-state">暂无该分类的 BD 推荐</p>'; return; }

  grid.innerHTML = data.map(b => {
    const isHtml = b.link_type === 'html';
    const href = escAttr(b.url || '#');
    const target = isHtml ? '' : ' target="_blank" rel="noopener"';
    const bCats = b.categories || [];
    const catChips = bCats.map(c => `<span class="bd-cat-chip">${esc(c)}</span>`).join('');
    const desc = b.description ? `<p class="bd-card-desc">${esc(b.description)}</p>` : '';

    return `<a href="${href}" class="bd-card"${target} onclick="${isHtml ? '' : "event.preventDefault();window.open('" + href + "','_blank')"}">
  <div class="bd-card-accent"></div>
  <div class="bd-card-inner">
    <div class="bd-card-header">
      <div class="bd-card-icon">⚔</div>
      <div>
        <div class="bd-card-title">${esc(b.title)}</div>
        <div class="bd-card-sub">BD攻略</div>
      </div>
    </div>
    ${desc}
    ${catChips ? `<div class="bd-card-cats">${catChips}</div>` : ''}
  </div>
  <div class="bd-card-footer">
    <div class="bd-card-cta">查看详情 →</div>
  </div>
</a>`;
  }).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escAttr(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.addEventListener('DOMContentLoaded', init);
</script>
<script src="js/speed-insights.js"></script>
</body>
</html>
