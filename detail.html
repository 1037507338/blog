<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title>My Blog | 文章详情</title>
    <meta name="description" content="一个专注于 Java 后端开发与前沿技术的个人博客">
    <meta name="viewport" content="width=device-width">
    <link rel="shortcut icon" href="./blog/amaze/images/compass.png">
    <link rel="stylesheet" href="./X-admin/css/font.css">
    <link rel="stylesheet" href="./X-admin/lib/layui/css/layui.css">
    <link rel="stylesheet" href="./blog/amaze/css/base.css">
    <link rel="stylesheet" href="./X-admin/editormd/css/editormd.preview.css">
    <style>
        pre code { white-space: pre; }
        blockquote {
            border-left: 4px solid #42b983;
            padding: 10px 0 10px 15px;
            color: #777;
            background-color: rgba(66, 185, 131, .1);
            max-width: 890px;
        }
        .editormd-html-preview ul > li { list-style: disc !important; }
        .editormd-html-preview ol > li { list-style: decimal !important; }
        .comment-page-btn { display:inline-block; padding:6px 12px; margin:0 4px; border:1px solid #ddd; cursor:pointer; border-radius:3px; text-decoration:none; color:#333; }
        .comment-page-btn.active { background:#5FB878; color:#fff; border-color:#5FB878; }
        .comment-page-btn:hover { background:#f0f0f0; }
        .comment-page-btn.active:hover { background:#4a9e63; }
        #commentPaging { text-align:center; margin:20px 0; }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar navbar-default navbar-custom navbar-fixed-top">
    <div class="container-fluid">
        <div class="navbar-header page-scroll">
            <button type="button" class="navbar-toggle" id="navbar-toggle">
                <span class="sr-only"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="./index.html" id="brandName">My Blog</a>
        </div>
        <div class="navbar-collapse" style="display: none" id="toggle-items">
            <ul class="nav navbar-nav navbar-right">
                <li><a href="./index.html">主页</a></li>
                <li><a href="./link.html">友链</a></li>
                <li><a href="./detail.html?id=1">关于</a></li>
                <li><a href="https://github.com/1037507338">GitHub</a></li>
            </ul>
        </div>
        <div id="huxblog_navbar">
            <div class="navbar-collapse">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="./index.html">主页</a></li>
                    <li><a href="./link.html">友链</a></li>
                    <li><a href="./detail.html?id=1">关于</a></li>
                    <li><a href="https://github.com/1037507338">GitHub</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- 头部 -->
<header class="intro-header" style="background-image:url('./blog/amaze/images/header.jpg');">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
                <div class="post-heading">
                    <h1 id="postTitle"></h1>
                    <span class="meta">
                        <span id="postDate"></span> &nbsp;
                        <div class="comments-view" style="display: inline-block">
                            <a href="#comments" class="article-comments"><span id="postCommentCount"></span>条评论</a> &nbsp;
                            <span id="postViews"></span>浏览
                        </div>
                    </span>
                    <div class="tags post-tags" id="postTags"></div>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="am-g am-g-fixed blog-fixed">
        <div class="am-u-lg-12 am-u-sm-12">
            <article id="test-markdown-view"></article>
            <aside class="blog-rights clearfix">
                <p>本站文章除注明转载/出处外，皆为作者原创，欢迎转载，但未经作者同意必须保留此段声明，且在文章页面明显位置给出原文连接，否则保留追究法律责任的权利。</p>
            </aside>
            <hr>
        </div>
    </div>

    <!-- 评论区 -->
    <div id="commentSection">
        <div id="volume" class="volume" style="display:none;">
            全部留言 <span id="totalComments"></span>
        </div>
        <aside class="comments" id="comments">
            <div id="list-cont" class="list-cont"></div>
            <div id="commentPaging"></div>
        </aside>
    </div>

    <!-- 评论表单 -->
    <div class="layui-form layui-form-pane" id="commentForm">
        <h2><i class="fa fa-pencil"></i> 添加评论</h2>
        <div class="layui-form-item">
            <label class="layui-form-label">昵称</label>
            <div class="layui-input-block">
                <input type="hidden" id="blogId" autocomplete="off">
                <input type="text" id="commentator" autocomplete="off" placeholder="必填,1-6个字符" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">邮箱</label>
            <div class="layui-input-block">
                <input type="text" id="email" autocomplete="off" placeholder="可不填" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">网站地址</label>
            <div class="layui-input-block">
                <input type="text" id="websiteUrl" autocomplete="off" placeholder="可不填" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">评论内容</label>
            <div class="layui-input-block">
                <textarea id="commentBody" placeholder="既然来了,不如说几句" class="layui-textarea"></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <button type="submit" class="layui-btn" id="commentSubmit">提交</button>
        </div>
    </div>

    <p class="back-top" id="back-top" style="display:none"><a href="#top"><span></span></a></p>
</div>

<!-- 页脚 -->
<footer class="footer blog-footer">
    <div class="blog-text-center">
        &copy; <span id="footerAuthor">博主</span>
        <span class="ft-warn">&heartsuit;</span>&nbsp;site blog
        <a>京ICP备2021003785号</a><br>
        Powered by <a href="#" target="_blank" id="footerCopyright">2024 My Blog</a>
    </div>
</footer>

<script src="./blog/plugins/jquery/jquery.min.js"></script>
<script src="./X-admin/editormd/lib/marked.min.js"></script>
<script src="./X-admin/editormd/lib/prettify.min.js"></script>
<script src="./X-admin/editormd/lib/raphael.min.js"></script>
<script src="./X-admin/editormd/lib/underscore.min.js"></script>
<script src="./X-admin/editormd/lib/sequence-diagram.min.js"></script>
<script src="./X-admin/editormd/lib/flowchart.min.js"></script>
<script src="./X-admin/editormd/lib/jquery.flowchart.min.js"></script>
<script src="./X-admin/editormd/src/editormd.js"></script>
<script src="./blog/plugins/comment/valid.js"></script>
<script src="./X-admin/lib/layui/layui.js"></script>

<script>
;(function() {
    var allData = null;
    var blogId = null;
    var commentPageSize = 5;
    var commentCurrPage = 1;

    // 支持路径参数 /blog/5 和查询参数 ?id=5
    function getBlogIdFromUrl() {
        var params = new URLSearchParams(window.location.search);
        var qId = params.get('id');
        if (qId) return qId;
        var pathMatch = window.location.pathname.match(/\/blog\/(\d+)/);
        if (pathMatch) return pathMatch[1];
        return '1';
    }

    blogId = getBlogIdFromUrl();

    $.getJSON('./data.json', function(data) {
        allData = data;
        initPage();
        initComment();
    }).fail(function() {
        $('#test-markdown-view').html('<p style="text-align:center;padding:50px;">数据加载失败，请刷新页面重试</p>');
    });

    function initPage() {
        var blog = findBlog(blogId);
        if (!blog) {
            $('#test-markdown-view').html('<p style="text-align:center;padding:50px;">文章不存在</p>');
            return;
        }

        // 基础信息
        document.title = allData.config.websiteName + ' | ' + blog.blogTitle;
        $('#brandName').text(allData.config.websiteName);
        $('#postTitle').text(blog.blogTitle);
        $('#postDate').text(blog.createTime);
        $('#postCommentCount').text(blog.commentCount || 0);
        $('#postViews').text(blog.blogViews || 0);

        // 标签
        var tagsHtml = '';
        if (blog.tags) {
            for (var i = 0; i < blog.tags.length; i++) {
                var t = blog.tags[i];
                tagsHtml += '<a class="tag" rel="tag" href="./list.html?tagId=' + t.tagId + '">' + t.tagName + '</a>&nbsp;';
            }
        }
        $('#postTags').html(tagsHtml);

        // Editor.md 渲染
        if (blog.blogContent && typeof editormd !== 'undefined') {
            editormd.markdownToHTML("test-markdown-view", {
                htmlDecode: "style,script,iframe",
                emoji: true,
                taskList: true,
                tex: true,
                flowChart: true,
                sequenceDiagram: true,
                markdown: blog.blogContent
            });
        } else if (blog.blogContent && typeof marked !== 'undefined') {
            $('#test-markdown-view').html(marked.parse(blog.blogContent));
        } else {
            $('#test-markdown-view').html('<pre>' + (blog.blogContent || '') + '</pre>');
        }

        // 页脚
        $('#footerAuthor').text(allData.config.sysAuthor);
        $('#footerCopyright').text(allData.config.sysCopyRight);

        // 设置 blogId 隐藏域
        $('#blogId').val(blogId);

        // 如果 enableComment != 0 则隐藏评论表单
        if (blog.enableComment !== 0) {
            $('#commentForm').hide();
        }
    }

    function findBlog(id) {
        var blogs = allData.blogs;
        for (var i = 0; i < blogs.length; i++) {
            if (blogs[i].blogId == id) return blogs[i];
        }
        return null;
    }

    function initComment() {
        var comments = allData.comments[blogId] || [];
        var count = comments.length;
        if (count === 0) {
            $('#volume').hide();
            return;
        }
        $('#volume').show();
        $('#totalComments').text(count);

        renderComments(1);
    }

    function renderComments(page) {
        commentCurrPage = page;
        var comments = allData.comments[blogId] || [];
        var totalPages = Math.ceil(comments.length / commentPageSize);
        var start = (page - 1) * commentPageSize;
        var end = Math.min(start + commentPageSize, comments.length);

        var strVal = '';
        for (var i = start; i < end; i++) {
            var c = comments[i];
            strVal += '<div class="cont">' +
                '<div class="img">' +
                '<img src="./blog/amaze/images/wordImg.png" style="width:50px;" alt="">' +
                '<p class="tit"><span class="name">' + (c.commentator || '匿名') + '</span><span class="data">' + (c.commentCreateTime || '') + '</span></p>' +
                '</div>' +
                '<div class="text"><p class="ct">' + (c.commentBody || '') + '</p></div>';

            if (c.replyBody) {
                strVal += '<div class="cont" style="padding-left:20px;">' +
                    '<div class="text">' +
                    '<p class="tit"><span class="name">回复</span><span class="data">' + (c.replyCreateTime || '') + '</span></p>' +
                    '<p class="ct">' + c.replyBody + '</p>' +
                    '</div></div>';
            }
            strVal += '</div><hr>';
        }

        $('#list-cont').html(strVal);

        // 分页按钮
        var pageHtml = '';
        if (totalPages > 1) {
            if (page > 1) {
                pageHtml += '<a href="javascript:;" class="comment-page-btn" data-page="' + (page - 1) + '">上一页</a>';
            }
            for (var p = 1; p <= totalPages; p++) {
                pageHtml += '<a href="javascript:;" class="comment-page-btn' + (p === page ? ' active' : '') + '" data-page="' + p + '">' + p + '</a>';
            }
            if (page < totalPages) {
                pageHtml += '<a href="javascript:;" class="comment-page-btn" data-page="' + (page + 1) + '">下一页</a>';
            }
        }
        $('#commentPaging').html(pageHtml);

        $('#commentPaging a').click(function() {
            var p = parseInt($(this).data('page'));
            if (p) {
                renderComments(p);
                $('html, body').animate({scrollTop: $('#comments').offset().top - 80}, 300);
            }
        });
    }

    // 导航切换
    $('#navbar-toggle').click(function() {
        $('#toggle-items').fadeToggle('fast');
    });

    // 返回顶部
    $(window).scroll(function() {
        if ($(this).scrollTop() > 300) {
            $('#back-top').fadeIn();
        } else {
            $('#back-top').fadeOut();
        }
    });
    $('#back-top a').click(function() {
        $('body,html').animate({scrollTop: 0}, 800);
        return false;
    });

    // 评论提交
    $('#commentSubmit').click(function() {
        var layuiLayer;
        try { layuiLayer = layui.layer; } catch(e) {}

        var commentator = $('#commentator').val().trim();
        var commentBody = $('#commentBody').val().trim();

        if (!commentator) {
            if (layuiLayer) layuiLayer.alert("请输入你的称呼", {icon: 5});
            else alert("请输入你的称呼");
            return;
        }
        if (!commentBody) {
            if (layuiLayer) layuiLayer.alert("请输入评论内容", {icon: 5});
            else alert("请输入评论内容");
            return;
        }
        if (layuiLayer) {
            layuiLayer.alert("静态演示站点，评论功能不可用", {icon: 0});
        } else {
            alert("静态演示站点，评论功能不可用");
        }
    });
})();
</script>
</body>
</html>
