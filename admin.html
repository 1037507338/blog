<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理后台 - POE2 Hub</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--border:#e0e0e0;--text:#333;--sub:#666;--accent:#1a73e8;--danger:#c33;--success:#2a9040}
[data-theme="dark"]{--bg:#1a1a1a;--card:#2a2a2a;--border:#444;--text:#e0e0e0;--sub:#aaa;--accent:#5ba3f5;--danger:#e55;--success:#5cb85c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:.3s;min-height:100vh}

.site-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--card);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem}
.site-nav-logo{font-size:1rem;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:6px}
.logo-icon{font-size:1.15rem;background:linear-gradient(135deg,#c9a227,#8b6914);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-left{display:flex;align-items:center;gap:12px}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-user{font-size:.85rem;color:var(--sub)}
.nav-logout{font-size:.85rem;color:var(--danger);text-decoration:none;cursor:pointer;padding:4px 10px;border-radius:5px;border:1px solid var(--danger);transition:.2s}
.nav-logout:hover{background:var(--danger);color:#fff}
.nav-back{font-size:.85rem;color:var(--sub);text-decoration:none;padding:4px 10px;border-radius:5px;border:1px solid var(--border);transition:.2s}
.nav-back:hover{color:var(--accent);border-color:var(--accent)}
#theme-toggle{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;transition:.2s}
#theme-toggle:hover{border-color:var(--accent);color:var(--accent)}

.wrap{max-width:1100px;margin:64px auto 2rem;padding:0 1.5rem}

/* 登录页 */
.login-container{max-width:380px;margin:100px auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.login-title{font-size:1.25rem;font-weight:700;text-align:center;margin-bottom:24px}
.login-title span{background:linear-gradient(135deg,#c9a227,#8b6914);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:7px;font-size:.9rem;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.btn{width:100%;padding:10px 18px;border-radius:7px;font-size:.9rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);transition:.2s}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{opacity:.9}
.login-error{color:var(--danger);font-size:.85rem;text-align:center;margin-top:12px;min-height:20px}

/* 工具栏 */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.btn-sm{padding:6px 14px;font-size:.82rem;width:auto}
.search-input{padding:8px 14px;border:1px solid var(--border);border-radius:7px;font-size:.85rem;background:var(--card);color:var(--text);width:220px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}

/* 分类筛选 */
.cat-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cat-chip{padding:4px 12px;border-radius:14px;font-size:.78rem;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;transition:.2s}
.cat-chip:hover,.cat-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(26,115,232,.06)}

/* 表格 */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:rgba(128,128,128,.04)}
th{padding:10px 14px;text-align:left;font-size:.82rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:10px 14px;font-size:.87rem;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(26,115,232,.03)}
.cat-tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.75rem;font-weight:600;background:rgba(26,115,232,.08);color:var(--accent)}
.type-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.72rem;font-weight:500}
.type-html{background:rgba(26,115,232,.1);color:var(--accent)}
.type-external{background:rgba(200,50,50,.1);color:var(--danger)}
.url-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub);font-size:.8rem}
.actions{display:flex;gap:6px}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}

/* 模态框 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.2s}
.modal-overlay.show{opacity:1;visibility:visible}
.modal{background:var(--card);border-radius:14px;width:500px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:translateY(20px);transition:.25s}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:1.05rem;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:rgba(128,128,128,.08);color:var(--sub);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-close:hover{background:rgba(200,50,50,.1);color:var(--danger)}
.modal-body{padding:20px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--border)}

/* Toast */
.toast{position:fixed;top:60px;right:1.5rem;padding:12px 20px;border-radius:8px;font-size:.85rem;font-weight:500;z-index:3000;transform:translateX(120%);transition:.3s;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.toast.show{transform:translateX(0)}
.toast-success{background:var(--success);color:#fff}
.toast-error{background:var(--danger);color:#fff}
.toast-info{background:var(--accent);color:#fff}

/* 空状态 */
.empty{text-align:center;padding:3rem;color:var(--sub);font-size:.95rem}
#admin-panel{display:none}
#admin-panel.show{display:block}
</style>
<link rel="icon" href="favicon.ico">
</head>
<body>

<nav class="site-nav">
  <div class="nav-left">
    <a href="index.html" class="site-nav-logo"><span class="logo-icon">⚔</span> POE2 Hub</a>
    <a href="index.html" class="nav-back">← 返回首页</a>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user" style="display:none">管理员</span>
    <span class="nav-logout" id="nav-logout" style="display:none" onclick="logout()">退出</span>
    <button id="theme-toggle" aria-label="切换主题">
      <svg class="theme-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="theme-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>

<!-- 登录页面 -->
<div class="login-container" id="login-container">
  <h1 class="login-title"><span>⚔</span> 管理后台登录</h1>
  <div class="form-group">
    <label>用户名</label>
    <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  </div>
  <button class="btn btn-primary" onclick="login()">登录</button>
  <div class="login-error" id="login-error"></div>
</div>

<!-- 管理面板 -->
<div id="admin-panel">
  <div class="wrap">
    <div class="toolbar">
      <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 新增链接</button>
      <input type="text" class="search-input" id="filterInput" placeholder="搜索标题/URL..." oninput="renderTable()">
    </div>

    <div class="cat-filter" id="catFilter"></div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>ID</th><th>标题</th><th>链接类型</th><th>URL</th><th>分类</th><th>操作</th>
        </tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 编辑模态框 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">新增链接</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-group"><label>标题 *</label><input type="text" id="editTitle" placeholder="如：POE2 冰法BD" required></div>
      <div class="form-group"><label>描述</label><input type="text" id="editDesc" placeholder="简短描述"></div>
      <div class="form-group">
        <label>链接类型 *</label>
        <select id="editLinkType" onchange="onLinkTypeChange()">
          <option value="external">🔗 外站链接（新标签页打开）</option>
          <option value="html">📄 站内HTML文件（原页打开）</option>
        </select>
      </div>
      <div class="form-group"><label>URL *</label><input type="url" id="editUrl" placeholder="https://..."></div>
      <div class="form-group">
        <label>分类 *</label>
        <select id="editCategory"></select>
      </div>
      <div class="form-group"><label>排序(可选)</label><input type="number" id="editSortOrder" placeholder="数字越小越靠前"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveLink()">保存</button>
    </div>
  </div>
</div>

<script>
const API_URL = '/api/links';
const ADMIN_USER = 'admin';
const ADMIN_PASS = '54188wang';
const AUTH_KEY = 'poe2_admin_auth';

let allLinks = [];
let activeCat = '全部';

// ===== 链接类型切换 =====
function onLinkTypeChange() {
  const t = document.getElementById('editLinkType').value;
  const urlInput = document.getElementById('editUrl');
  if (t === 'html') {
    urlInput.placeholder = '如：/builds/xyz.html（站内相对路径）';
    urlInput.removeAttribute('pattern');
  } else {
    urlInput.placeholder = 'https://...';
    urlInput.setAttribute('pattern', 'https?://.*');
  }
}

// ===== 登录验证 =====
function checkAuth() {
  const auth = sessionStorage.getItem(AUTH_KEY);
  if (auth === 'true') { showAdminPanel(); return true; }
  return false;
}

function login() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  if (username === ADMIN_USER && password === ADMIN_PASS) {
    sessionStorage.setItem(AUTH_KEY, 'true');
    showAdminPanel();
    errorEl.textContent = '';
  } else {
    errorEl.textContent = '用户名或密码错误';
  }
}

function logout() { sessionStorage.removeItem(AUTH_KEY); location.reload(); }

function showAdminPanel() {
  document.getElementById('login-container').style.display = 'none';
  document.getElementById('admin-panel').classList.add('show');
  document.getElementById('nav-user').style.display = 'inline';
  document.getElementById('nav-logout').style.display = 'inline';
  loadData();
}

// ===== 数据加载 =====
async function loadData() {
  try {
    const resp = await fetch(API_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    allLinks = await resp.json();
    renderCatFilter();
    renderTable();
  } catch (e) {
    console.error('加载失败:', e);
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="empty">加载失败: ' + e.message + '</td></tr>';
  }
}

// ===== 分类筛选 =====
function renderCatFilter() {
  const cats = ['全部', ...new Set(allLinks.map(l=>l.category).sort())];
  document.getElementById('catFilter').innerHTML = cats.map(c =>
    `<span class="cat-chip${c===activeCat?' active':''}" onclick="setCatFilter('${escAttr(c)}')">${esc(c)} (${c==='全部'?allLinks.length:allLinks.filter(l=>l.category===c).length})</span>`
  ).join('');
}
function setCatFilter(c){ activeCat=c; renderCatFilter(); renderTable(); }

// ===== 表格渲染 =====
function renderTable() {
  const q = (document.getElementById('filterInput').value||'').trim().toLowerCase();
  let data = activeCat==='全部' ? allLinks : allLinks.filter(l=>l.category===activeCat);
  if (q) data = data.filter(l=>
    (l.title||'').toLowerCase().includes(q)||(l.description||'').toLowerCase().includes(q)||(l.url||'').toLowerCase().includes(q)
  );
  const tbody = document.getElementById('tableBody');
  if (!data.length) { tbody.innerHTML='<tr><td colspan="6" class="empty">无匹配数据</td></tr>'; return; }
  tbody.innerHTML = data.map(l => {
    const isHtml = l.link_type === 'html';
    const typeTag = isHtml
      ? '<span class="type-tag type-html">📄 站内HTML</span>'
      : '<span class="type-tag type-external">🔗 外站链接</span>';
    return `<tr>
      <td>${l.id}</td>
      <td><strong>${esc(l.title)}</strong></td>
      <td>${typeTag}</td>
      <td class="url-cell" title="${esc(l.url)}">${esc(l.url)}</td>
      <td><span class="cat-tag">${esc(l.category)}</span></td>
      <td class="actions">
        <button class="btn btn-sm" onclick="openEditModal(${l.id})">✏️</button>
        <button class="btn btn-sm btn-danger" onclick="deleteLink(${l.id})">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}

// ===== 模态框 =====
function openAddModal() {
  document.getElementById('modalTitle').textContent = '新增链接';
  document.getElementById('editId').value = '';
  document.getElementById('editTitle').value = '';
  document.getElementById('editDesc').value = '';
  document.getElementById('editUrl').value = '';
  document.getElementById('editLinkType').value = 'external';
  onLinkTypeChange();
  document.getElementById('editSortOrder').value = '';
  populateCategories();
  document.getElementById('editCategory').value = '';
  showModal();
}

function openEditModal(id) {
  const l = allLinks.find(x=>x.id===id);
  if (!l) return;
  document.getElementById('modalTitle').textContent = '编辑链接';
  document.getElementById('editId').value = id;
  document.getElementById('editTitle').value = l.title||'';
  document.getElementById('editDesc').value = l.description||'';
  document.getElementById('editUrl').value = l.url||'';
  document.getElementById('editLinkType').value = l.link_type||'external';
  onLinkTypeChange();
  document.getElementById('editSortOrder').value = l.sort_order||'';
  populateCategories();
  document.getElementById('editCategory').value = l.category||'';
  showModal();
}

function populateCategories() {
  const cats = [...new Set(allLinks.map(l=>l.category))].sort();
  const sel = document.getElementById('editCategory');
  sel.innerHTML = cats.map(c=>`<option value="${escAttr(c)}">${esc(c)}</option>`).join('');
  sel.innerHTML += '<option value="__new__">+ 新分类</option>';
  sel.onchange = function() {
    if (this.value === '__new__') {
      const n = prompt('输入新分类名称：');
      if (n) {
        const v = n.trim();
        this.innerHTML += `<option value="${escAttr(v)}">${esc(v)}</option>`;
        this.value = v;
      }
    }
  };
}

function showModal(){ document.getElementById('editModal').classList.add('show'); }
function closeModal(){ document.getElementById('editModal').classList.remove('show'); }

// ===== CRUD =====
async function saveLink() {
  const id = document.getElementById('editId').value;
  const title = (document.getElementById('editTitle').value||'').trim();
  const description = (document.getElementById('editDesc').value||'').trim();
  const url = (document.getElementById('editUrl').value||'').trim();
  const link_type = document.getElementById('editLinkType').value;
  const category = (document.getElementById('editCategory').value||'').trim();
  const sort_order = parseInt(document.getElementById('editSortOrder').value)||0;

  if (!title || !url) { toast('请填写标题和URL','error'); return; }
  if (link_type === 'external' && !url.startsWith('http')) { toast('外站链接需以 http(s) 开头','error'); return; }

  const link = { title, description, url, category: category||'未分类', sort_order, link_type: link_type||'external' };

  try {
    let resp;
    if (id) {
      resp = await fetch(`${API_URL}?id=${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(link) });
    } else {
      resp = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(link) });
    }
    if (!resp.ok) { const err = await resp.json(); throw new Error(err.error||'保存失败'); }
    toast(id ? '✅ 已更新' : '✅ 已新增', 'success');
    closeModal();
    await loadData();
  } catch (e) { toast('保存失败: '+e.message, 'error'); }
}

async function deleteLink(id) {
  const link = allLinks.find(l=>l.id===id);
  if (!confirm(`确认删除「${link?.title}」？`)) return;
  try {
    const resp = await fetch(`${API_URL}?id=${id}`, { method:'DELETE' });
    if (!resp.ok) { const err = await resp.json(); throw new Error(err.error||'删除失败'); }
    toast('🗑️ 已删除', 'info');
    await loadData();
  } catch (e) { toast('删除失败: '+e.message, 'error'); }
}

// ===== Toast =====
function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`; el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 300); }, 2500);
}

// ===== 工具函数 =====
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function escAttr(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== 主题切换 =====
document.addEventListener('DOMContentLoaded', ()=>{
  const saved = localStorage.getItem('theme');
  if (saved) document.body.setAttribute('data-theme', saved);
  else document.body.setAttribute('data-theme', matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const btn = document.getElementById('theme-toggle'),
        sun = btn?.querySelector('.theme-sun'),
        moon = btn?.querySelector('.theme-moon');
  function upd(t){ if(sun) sun.style.display = t==='dark'?'none':'block'; if(moon) moon.style.display = t==='dark'?'block':'none'; }
  upd(document.body.getAttribute('data-theme'));
  if (btn) btn.onclick = ()=>{
    const c = document.body.getAttribute('data-theme')==='dark'?'light':'dark';
    document.body.setAttribute('data-theme', c); localStorage.setItem('theme', c); upd(c);
  };
  if (!checkAuth()) { /* 未登录，显示登录框 */ }
});
</script>
</body>
</html>
