<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理后台 - POE2 Hub</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--border:#e0e0e0;--text:#333;--sub:#666;--accent:#1a73e8;--danger:#c33;--success:#2a9040}
[data-theme="dark"]{--bg:#1a1a1a;--card:#2a2a2a;--border:#444;--text:#e0e0e0;--sub:#aaa;--accent:#5ba3f5;--danger:#e55;--success:#5cb85c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:.3s;min-height:100vh}

.site-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--card);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem}
.site-nav-logo{font-size:1rem;font-weight:700;color:var(--text);text-decoration:none}
.logo-icon{background:linear-gradient(135deg,#c9a227,#8b6914);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-left,.nav-right{display:flex;align-items:center;gap:10px}
.nav-user{font-size:.85rem;color:var(--sub)}
.nav-logout{font-size:.85rem;color:var(--danger);text-decoration:none;cursor:pointer;padding:4px 10px;border-radius:5px;border:1px solid var(--danger);transition:.2s}
.nav-logout:hover{background:var(--danger);color:#fff}
.nav-back{font-size:.85rem;color:var(--sub);text-decoration:none;padding:4px 10px;border-radius:5px;border:1px solid var(--border);transition:.2s}
.nav-back:hover{color:var(--accent);border-color:var(--accent)}
#theme-toggle{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;transition:.2s}
#theme-toggle:hover{border-color:var(--accent);color:var(--accent)}

.wrap{max-width:1200px;margin:64px auto 2rem;padding:0 1.5rem}

/* 登录页 */
.login-container{max-width:380px;margin:100px auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.login-title{font-size:1.25rem;font-weight:700;text-align:center;margin-bottom:24px}
.login-title span{background:linear-gradient(135deg,#c9a227,#8b6914);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:7px;font-size:.9rem;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.btn{width:100%;padding:10px 18px;border-radius:7px;font-size:.9rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);transition:.2s}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{opacity:.9}
.btn-sm{padding:6px 14px;font-size:.82rem;width:auto}
.login-error{color:var(--danger);font-size:.85rem;text-align:center;margin-top:12px;min-height:20px}

/* ===== 一级 Tab ===== */
.page-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:24px;overflow-x:auto;scrollbar-width:none}
.page-tabs::-webkit-scrollbar{display:none}
.page-tab{padding:10px 20px;font-size:.9rem;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .2s,border-color .2s;background:none;border-top:none;border-left:none;border-right:none}
.page-tab:hover{color:var(--accent)}
.page-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-count{display:inline-block;background:var(--border);color:var(--sub);border-radius:10px;padding:0 6px;font-size:.72rem;margin-left:6px;font-weight:400}

/* 工具栏 */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}

/* ===== 自定义分类筛选下拉 ===== */
.cat-filter-wrap{position:relative;display:inline-block}
.cat-filter-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.85rem;cursor:pointer;transition:.2s;min-width:130px}
.cat-filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-filter-btn .arrow{font-size:.7rem;transition:transform .2s}
.cat-filter-btn.open .arrow{transform:rotate(180deg)}
.cat-filter-dropdown{position:absolute;top:calc(100% + 4px);left:0;min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:500;overflow:hidden;display:none}
.cat-filter-dropdown.open{display:block}
.cat-filter-search{padding:8px 12px;border-bottom:1px solid var(--border)}
.cat-filter-search input{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;background:var(--bg);color:var(--text);outline:none}
.cat-filter-search input:focus{border-color:var(--accent)}
.cat-filter-list{max-height:220px;overflow-y:auto;padding:6px 0}
.cat-filter-item{padding:7px 14px;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s}
.cat-filter-item:hover{background:rgba(26,115,232,.06)}
.cat-filter-item.active{color:var(--accent);font-weight:600}
.cat-filter-item .check{width:16px;font-size:.75rem}
.cat-filter-item .count{font-size:.72rem;color:var(--sub);margin-left:auto}

/* 搜索框 */
.search-input{padding:8px 14px;border:1px solid var(--border);border-radius:7px;font-size:.85rem;background:var(--card);color:var(--text);width:240px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}

/* 表格 */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:rgba(128,128,128,.04)}
th{padding:10px 14px;text-align:left;font-size:.82rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:10px 14px;font-size:.87rem;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(26,115,232,.03)}
.cat-tags{display:flex;gap:4px;flex-wrap:wrap}
.cat-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.72rem;font-weight:600;background:rgba(26,115,232,.08);color:var(--accent);white-space:nowrap}
.type-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.72rem;font-weight:500}
.type-html{background:rgba(26,115,232,.1);color:var(--accent)}
.type-external{background:rgba(200,50,50,.1);color:#c33}
.url-cell{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub);font-size:.8rem}
.actions{display:flex;gap:6px}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.empty{text-align:center;padding:3rem;color:var(--sub);font-size:.95rem}

/* ===== 模态框 ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.2s}
.modal-overlay.show{opacity:1;visibility:visible}
.modal{background:var(--card);border-radius:14px;width:520px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:translateY(20px);transition:.25s}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:1.05rem;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:rgba(128,128,128,.08);color:var(--sub);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-close:hover{background:rgba(200,50,50,.1);color:var(--danger)}
.modal-body{padding:24px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--border)}

.hint{cursor:help;color:var(--sub);font-size:.85rem;margin-left:4px}

/* ===== 分类多选 Tag 输入 ===== */
.cat-multi-label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:6px}
.cat-multi-hint{font-size:.75rem;color:var(--sub);font-weight:400;margin-left:6px}
.cat-multi-wrap{border:1px solid var(--border);border-radius:7px;background:var(--bg);min-height:80px;max-height:160px;overflow-y:auto;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;transition:border-color .2s;cursor:text}
.cat-multi-wrap:focus-within{border-color:var(--accent)}
.cat-multi-tag{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:.8rem;font-weight:500;background:rgba(26,115,232,.1);color:var(--accent);border:1px solid rgba(26,115,232,.2);white-space:nowrap}
.cat-multi-tag .remove{width:14px;height:14px;border-radius:50%;background:rgba(26,115,232,.15);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.65rem;line-height:1;flex-shrink:0}
.cat-multi-tag .remove:hover{background:var(--accent);color:#fff}
.cat-multi-tag.readonly{opacity:.6;cursor:default}
.cat-multi-tag.readonly .remove{display:none}
.cat-multi-input{flex:1;min-width:80px;border:none;outline:none;background:transparent;font-size:.85rem;color:var(--text);padding:4px 2px}
.cat-add-btn{width:28px;height:28px;border-radius:6px;border:1px dashed var(--border);background:transparent;color:var(--sub);cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;align-self:flex-start;margin-top:4px}
.cat-add-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(26,115,232,.05)}

/* 新分类自定义弹窗 */
.cat-new-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:3000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.2s}
.cat-new-modal-overlay.show{opacity:1;visibility:visible}
.cat-new-modal{background:var(--card);border-radius:12px;width:360px;max-width:90vw;padding:24px;box-shadow:0 16px 48px rgba(0,0,0,.2);transform:scale(.95);transition:.2s}
.cat-new-modal-overlay.show .cat-new-modal{transform:scale(1)}
.cat-new-modal h3{font-size:1rem;font-weight:700;margin-bottom:14px}
.cat-new-modal input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:7px;font-size:.9rem;background:var(--bg);color:var(--text);outline:none;margin-bottom:14px;font-family:inherit}
.cat-new-modal input:focus{border-color:var(--accent)}
.cat-new-modal .btns{display:flex;gap:8px;justify-content:flex-end}
.cat-new-modal .btn-cancel{padding:8px 16px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.85rem;transition:.2s}
.cat-new-modal .btn-cancel:hover{background:var(--border)}
.cat-new-modal .btn-confirm{padding:8px 16px;border-radius:7px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:.85rem;transition:.2s}
.cat-new-modal .btn-confirm:hover{opacity:.9}
.cat-new-error{color:var(--danger);font-size:.8rem;margin-bottom:10px;min-height:18px}

/* ===== 图标选择器（BD推荐专用） ===== */
.icon-picker-wrap{border:1px solid var(--border);border-radius:7px;background:var(--bg);padding:10px}
.icon-picker-current{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.icon-picker-preview{width:42px;height:42px;border-radius:8px;background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.25);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;overflow:hidden}
.icon-picker-preview img{width:30px;height:30px;object-fit:contain}
.icon-picker-input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;background:var(--card);color:var(--text);outline:none;font-family:inherit}
.icon-picker-input:focus{border-color:var(--accent)}
.icon-picker-clear{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;font-size:.78rem;transition:.2s}
.icon-picker-clear:hover{border-color:var(--danger);color:var(--danger)}
.icon-picker-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icon-preset{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:1px solid transparent;border-radius:7px;background:var(--card);cursor:pointer;transition:.18s}
.icon-preset:hover{border-color:var(--accent);background:rgba(26,115,232,.05)}
.icon-preset.active{border-color:#c9a227;background:rgba(201,162,39,.12)}
.icon-preset img{width:26px;height:26px;object-fit:contain}
.icon-preset-label{font-size:.66rem;color:var(--sub);line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.icon-picker-hint{font-size:.72rem;color:var(--sub);margin-top:8px;line-height:1.5}
@media(max-width:520px){.icon-picker-grid{grid-template-columns:repeat(4,1fr)}}

/* Toast */
.toast{position:fixed;top:60px;right:1.5rem;padding:12px 20px;border-radius:8px;font-size:.85rem;font-weight:500;z-index:4000;transform:translateX(120%);transition:.3s;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.toast.show{transform:translateX(0)}
.toast-success{background:var(--success);color:#fff}
.toast-error{background:var(--danger);color:#fff}
.toast-info{background:var(--accent);color:#fff}

#admin-panel{display:none}
#admin-panel.show{display:block}
</style>
<link rel="icon" href="favicon.ico">
</head>
<body>

<nav class="site-nav">
  <div class="nav-left">
    <a href="index.html" class="site-nav-logo"><span class="logo-icon">⚔</span> POE2 Hub</a>
    <a href="index.html" class="nav-back">← 返回首页</a>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user" style="display:none">管理员</span>
    <span class="nav-logout" id="nav-logout" style="display:none" onclick="logout()">退出</span>
    <button id="theme-toggle" aria-label="切换主题">
      <svg class="theme-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="theme-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>

<!-- 登录页 -->
<div class="login-container" id="login-container">
  <h1 class="login-title"><span>⚔</span> 管理后台登录</h1>
  <div class="form-group"><label>用户名</label><input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username"></div>
  <div class="form-group"><label>密码</label><input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
  <button class="btn btn-primary" onclick="login()">登录</button>
  <div class="login-error" id="login-error"></div>
</div>

<!-- 管理面板 -->
<div id="admin-panel">
  <div class="wrap">
    <!-- 一级 Tab -->
    <div class="page-tabs" id="pageTabs"></div>

    <!-- 链接 Tab 内容（首页导航 / BD推荐） -->
    <div class="tab-content" id="tabContent">
      <div class="toolbar">
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 新增链接</button>
        <!-- 自定义分类筛选下拉 -->
        <div class="cat-filter-wrap" id="catFilterWrap">
          <button class="cat-filter-btn" id="catFilterBtn" onclick="toggleCatDropdown()">
            <span id="catFilterLabel">全部</span>
            <span class="arrow">▼</span>
          </button>
          <div class="cat-filter-dropdown" id="catFilterDropdown">
            <div class="cat-filter-search">
              <input type="text" id="catFilterSearch" placeholder="搜索分类..." oninput="renderCatFilterList()">
            </div>
            <div class="cat-filter-list" id="catFilterList"></div>
          </div>
        </div>
        <input type="text" class="search-input" id="filterInput" placeholder="搜索标题/描述/URL..." oninput="renderTable()">
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:40px">ID</th>
            <th>标题 / 描述</th>
            <th>链接类型</th>
            <th>URL</th>
            <th>分类</th>
            <th style="width:50px">排序</th>
            <th style="width:80px">操作</th>
          </tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 资讯动态 Tab 内容 -->
    <div class="tab-content" id="newsTabContent" style="display:none">
      <div class="toolbar">
        <button class="btn btn-primary btn-sm" onclick="openAddNewsModal()">+ 新增资讯</button>
        <input type="text" class="search-input" id="newsFilterInput" placeholder="搜索标题/摘要/标签..." oninput="renderNewsTable()">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:40px">ID</th>
            <th>标题 / 摘要</th>
            <th style="width:90px">标签</th>
            <th style="width:90px">类型</th>
            <th style="width:110px">发布日期</th>
            <th style="width:50px">排序</th>
            <th style="width:80px">操作</th>
          </tr></thead>
          <tbody id="newsTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 网站设置 Tab 内容 -->
    <div class="tab-content" id="settingsTabContent" style="display:none">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;max-width:760px">
        <h3 style="font-size:1rem;font-weight:700;margin-bottom:14px;color:var(--text)">首页功能开关</h3>

        <div class="setting-row" style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:.95rem;color:var(--text);margin-bottom:4px">国服开服倒计时</div>
            <div style="font-size:.8rem;color:var(--sub);line-height:1.5">在首页顶部显示腾讯国服 POE2 下个赛季的开服倒计时（数据来自 poe2db.tw）</div>
          </div>
          <label class="toggle-switch" style="position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0">
            <input type="checkbox" id="cfgPoe2Countdown" onchange="toggleSiteConfig('poe2_cn_countdown', this.checked)" style="opacity:0;width:0;height:0">
            <span class="toggle-slider" style="position:absolute;cursor:pointer;inset:0;background:var(--border2,#ccc);border-radius:24px;transition:.2s"></span>
          </label>
        </div>

        <div style="margin-top:14px;font-size:.78rem;color:var(--sub);line-height:1.6">
          💡 提示：设置保存后，首页 CDN 缓存会在 5 分钟内自动更新；用户刷新页面即可看到最新效果。
        </div>
      </div>
    </div>
  </div>

  <style>
    .toggle-switch input:checked + .toggle-slider { background: var(--brand, #1a73e8); }
    .toggle-slider:before { content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
    .toggle-switch input:checked + .toggle-slider:before { transform:translateX(20px); }
  </style>
</div>

<!-- 编辑模态框 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">新增链接</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">

      <!-- 页面类型（只读） -->
      <div class="form-group">
        <label>页面类型</label>
        <input type="text" id="editPageTypeDisplay" readonly style="background:var(--border);color:var(--sub);cursor:not-allowed">
      </div>

      <!-- 标题 -->
      <div class="form-group"><label>标题 *</label><input type="text" id="editTitle" placeholder="如：POE2 冰法BD"></div>

      <!-- 描述 -->
      <div class="form-group"><label>描述</label><input type="text" id="editDesc" placeholder="简短描述（选填）"></div>

      <!-- 链接类型 -->
      <div class="form-group">
        <label>链接类型 * <span class="hint" title="外站链接：在新标签页打开\n站内HTML：在当前页打开">ⓘ</span></label>
        <select id="editLinkType" onchange="onLinkTypeChange()">
          <option value="external">🔗 外站链接（新标签页打开）</option>
          <option value="html">📄 站内HTML文件（原页打开）</option>
        </select>
      </div>

      <!-- URL -->
      <div class="form-group" id="urlInputWrap"><label>URL *</label><input type="url" id="editUrl" placeholder="https://..."></div>

      <!-- HTML 文件下拉 -->
      <div class="html-file-wrap" id="htmlFileWrap">
        <div class="form-group" style="margin-bottom:0">
          <label style="font-size:.78rem;color:var(--sub);margin-bottom:4px;display:block">从 builds/ 目录选择：</label>
          <select id="htmlFileSelect" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:7px;font-size:.88rem;background:var(--bg);color:var(--text);outline:none" onchange="onHtmlFileSelect()">
            <option value="">— 请选择 HTML 文件 —</option>
          </select>
        </div>
      </div>

      <!-- 排序 -->
      <div class="form-group"><label>排序权重</label><input type="number" id="editSortOrder" value="0" placeholder="数字越小越靠前" style="width:140px"></div>

      <!-- 图标选择（仅 BD 推荐） -->
      <div class="form-group" id="iconPickerGroup" style="display:none">
        <label class="cat-multi-label">图标 <span class="cat-multi-hint">（点击预设或自定义 emoji / 图片 URL / iconify 名）</span></label>
        <div class="icon-picker-wrap">
          <div class="icon-picker-current">
            <div class="icon-picker-preview" id="iconPreview">⚔</div>
            <input type="text" class="icon-picker-input" id="editIcon" placeholder="留空使用默认 ⚔  /  emoji  /  https://...  /  game-icons:fire-bow" oninput="onIconInput()">
            <button type="button" class="icon-picker-clear" onclick="setIcon('')">清空</button>
          </div>
          <div class="icon-picker-grid" id="iconPresetGrid"></div>
          <p class="icon-picker-hint">💡 预设来自 <a href="https://icon-sets.iconify.design/game-icons/" target="_blank" rel="noopener">Iconify · game-icons</a>（POE2 风格奇幻图标）。也可贴图片 URL（如英雄联盟头像）或 emoji。</p>
        </div>
      </div>

      <!-- 分类多选（Tag 输入） -->
      <div class="form-group" style="margin-top:16px">
        <label class="cat-multi-label">分类 <span class="cat-multi-hint">（可多选，点击 + 新增）</span></label>
        <div class="cat-multi-wrap" id="catMultiWrap" onclick="document.getElementById('catMultiInput').focus()">
          <input type="text" class="cat-multi-input" id="catMultiInput" placeholder="输入分类名后回车添加..." onkeydown="onCatInputKey(event)">
          <button class="cat-add-btn" id="catAddBtn" onclick="openCatNewModal()" title="新建分类">+</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveLink()">保存</button>
    </div>
  </div>
</div>

<!-- 资讯编辑模态框 -->
<div class="modal-overlay" id="newsModal">
  <div class="modal" style="width:640px">
    <div class="modal-header">
      <h2 id="newsModalTitle">新增资讯</h2>
      <button class="modal-close" onclick="closeNewsModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="newsEditId">

      <div class="form-group"><label>标题 *</label><input type="text" id="newsTitle" placeholder="如：0.3.0 第三教条更新"></div>

      <div class="form-group"><label>摘要</label><textarea id="newsSummary" rows="2" placeholder="列表页显示的简短摘要（选填）"></textarea></div>

      <div style="display:flex;gap:12px">
        <div class="form-group" style="flex:1"><label>标签</label><input type="text" id="newsTag" placeholder="如：版本更新 / 联赛 / 国服" list="newsTagSuggest"><datalist id="newsTagSuggest"><option value="版本更新"><option value="联赛"><option value="国服"><option value="攻略"><option value="新内容"></datalist></div>
        <div class="form-group" style="width:140px"><label>标签颜色</label><input type="color" id="newsTagColor" value="#1a73e8" style="height:38px;padding:2px"></div>
      </div>

      <div style="display:flex;gap:12px">
        <div class="form-group" style="flex:1">
          <label>正文类型 * <span class="hint" title="跳转链接：点击卡片新窗口打开\nMarkdown：在站内详情页渲染">ⓘ</span></label>
          <select id="newsContentType" onchange="onNewsContentTypeChange()">
            <option value="link">🔗 跳转链接</option>
            <option value="markdown">📝 Markdown 正文</option>
          </select>
        </div>
        <div class="form-group" style="width:180px"><label>发布日期</label><input type="date" id="newsPublishedAt"></div>
        <div class="form-group" style="width:100px"><label>排序</label><input type="number" id="newsSortOrder" value="0" placeholder="0"></div>
      </div>

      <div class="form-group" id="newsUrlWrap"><label>跳转 URL *</label><input type="url" id="newsUrl" placeholder="https://..."></div>

      <div class="form-group" id="newsContentWrap" style="display:none">
        <label>Markdown 正文 *</label>
        <textarea id="newsContent" rows="12" placeholder="支持标准 Markdown 语法，如：&#10;## 标题&#10;- 列表&#10;**加粗** *斜体*&#10;[链接](https://...)&#10;```代码块```" style="font-family:'SF Mono','Menlo',monospace;font-size:.85rem"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeNewsModal()">取消</button>
      <button class="btn btn-primary" onclick="saveNews()">保存</button>
    </div>
  </div>
</div>

<!-- 新建分类弹窗 -->
<div class="cat-new-modal-overlay" id="catNewModal">
  <div class="cat-new-modal">
    <h3>新建分类</h3>
    <div class="cat-new-error" id="catNewError"></div>
    <input type="text" id="catNewInput" placeholder="输入分类名称" maxlength="20" onkeydown="if(event.key==='Enter')confirmCatNew();if(event.key==='Escape')closeCatNewModal()">
    <div class="btns">
      <button class="btn-cancel" onclick="closeCatNewModal()">取消</button>
      <button class="btn-confirm" onclick="confirmCatNew()">确定</button>
    </div>
  </div>
</div>

<script>
const API_LINKS = '/api/links';
const API_NEWS = '/api/news';
const API_FILES = '/api/builds-files';
const ADMIN_USER = 'admin';
const ADMIN_PASS = '54188wang';
const AUTH_KEY = 'poe2_admin_auth';
const PAGE_TYPES = ['首页导航', 'BD推荐', '资讯动态', '网站设置'];
const API_CONFIG = '/api/site-config';
let siteConfig = {};

let allLinks = [];
let allNews = [];
let htmlFiles = [];
let activeTab = '首页导航';
let activeCat = '全部';
let selectedCats = []; // 当前编辑的分类 tag

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('theme');
  if (saved) document.body.setAttribute('data-theme', saved);
  else document.body.setAttribute('data-theme', matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.onclick = () => {
    const c = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', c); localStorage.setItem('theme', c);
    updateThemeIcons(c);
  };
  if (!checkAuth()) return;
  showAdminPanel();
});

function updateThemeIcons(theme) {
  const sun = document.querySelector('#theme-toggle .theme-sun');
  const moon = document.querySelector('#theme-toggle .theme-moon');
  if (sun) sun.style.display = theme === 'dark' ? 'none' : 'block';
  if (moon) moon.style.display = theme === 'dark' ? 'block' : 'none';
}

// ===== 认证 =====
function checkAuth() { return sessionStorage.getItem(AUTH_KEY) === 'true'; }
function login() {
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  if (u === ADMIN_USER && p === ADMIN_PASS) {
    sessionStorage.setItem(AUTH_KEY, 'true'); showAdminPanel();
    document.getElementById('login-error').textContent = '';
  } else { document.getElementById('login-error').textContent = '用户名或密码错误'; }
}
function logout() { sessionStorage.removeItem(AUTH_KEY); location.reload(); }
function showAdminPanel() {
  document.getElementById('login-container').style.display = 'none';
  document.getElementById('admin-panel').classList.add('show');
  document.getElementById('nav-user').style.display = 'inline';
  document.getElementById('nav-logout').style.display = 'inline';
  loadAllData();
}

// ===== 加载 =====
async function loadAllData() {
  await Promise.all([loadLinks(), loadNews(), loadHtmlFiles(), loadSiteConfig()]);
  renderPageTabs();
  switchTab(activeTab);
  renderHtmlFileSelect();
}

async function loadSiteConfig() {
  try {
    const resp = await fetch(API_CONFIG + '?fresh=1', { cache: 'no-store' });
    siteConfig = resp.ok ? await resp.json() : {};
  } catch (e) { siteConfig = {}; }
}

async function toggleSiteConfig(key, val) {
  try {
    const resp = await fetch(API_CONFIG, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, value: val })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    siteConfig[key] = val;
  } catch (e) {
    alert('保存失败：' + e.message);
    // 回滚 UI
    const cb = document.getElementById('cfgPoe2Countdown');
    if (cb) cb.checked = !val;
  }
}

function applySiteConfigToUI() {
  const cb = document.getElementById('cfgPoe2Countdown');
  if (cb) cb.checked = !!siteConfig.poe2_cn_countdown;
}

async function loadLinks() {
  try {
    // admin 带 fresh=1 + cache:'no-store'，绕过 CDN/浏览器缓存，始终拿数据库最新
    const resp = await fetch(API_LINKS + '?fresh=1', { cache: 'no-store' });
    allLinks = resp.ok ? await resp.json() : [];
  } catch (e) { allLinks = []; }
}

async function loadNews() {
  try {
    const resp = await fetch(API_NEWS + '?fresh=1', { cache: 'no-store' });
    allNews = resp.ok ? await resp.json() : [];
  } catch (e) { allNews = []; }
}

async function loadHtmlFiles() {
  try {
    const resp = await fetch(API_FILES);
    if (resp.ok) { const d = await resp.json(); htmlFiles = d.files || []; }
  } catch (e) { htmlFiles = []; }
}

// ===== Tab =====
function renderPageTabs() {
  document.getElementById('pageTabs').innerHTML = PAGE_TYPES.map(pt => {
    let count;
    if (pt === '资讯动态') count = allNews.length;
    else if (pt === '网站设置') count = '';
    else count = allLinks.filter(l => l.page_type === pt).length;
    const countHtml = count !== '' ? `<span class="tab-count">${count}</span>` : '';
    return `<button class="page-tab${pt === activeTab ? ' active' : ''}" onclick="switchTab('${escAttr(pt)}')">${esc(pt)} ${countHtml}</button>`;
  }).join('');
}

function switchTab(pt) {
  activeTab = pt;
  activeCat = '全部';
  document.getElementById('catFilterLabel').textContent = '全部';
  closeCatDropdown();
  const isNews = pt === '资讯动态';
  const isSettings = pt === '网站设置';
  const isLinks = !isNews && !isSettings;
  document.getElementById('tabContent').style.display = isLinks ? 'block' : 'none';
  document.getElementById('newsTabContent').style.display = isNews ? 'block' : 'none';
  document.getElementById('settingsTabContent').style.display = isSettings ? 'block' : 'none';
  renderPageTabs();
  if (isNews) renderNewsTable();
  else if (isSettings) applySiteConfigToUI();
  else renderTable();
}

// ===== 分类筛选下拉（自定义） =====
function getAllCats() {
  // 收集当前页面类型下所有行里出现过的所有分类
  const cats = {};
  allLinks.filter(l => l.page_type === activeTab).forEach(l => {
    const catsArr = l.categories;
    if (Array.isArray(catsArr) && catsArr.length) {
      catsArr.forEach(c => { cats[c] = (cats[c] || 0) + 1; });
    } else if (l.category) {
      cats[l.category] = (cats[l.category] || 0) + 1;
    }
  });
  return Object.entries(cats).sort((a, b) => b[1] - a[1]); // 按使用频率排序
}

function renderCatFilterList() {
  const q = (document.getElementById('catFilterSearch').value || '').toLowerCase();
  const cats = getAllCats().filter(([c]) => c.toLowerCase().includes(q));
  const list = document.getElementById('catFilterList');
  if (!cats.length) {
    list.innerHTML = '<div style="padding:12px 14px;color:var(--sub);font-size:.82rem;text-align:center">无匹配分类</div>';
    return;
  }
  list.innerHTML = [
    `<div class="cat-filter-item${activeCat === '全部' ? ' active' : ''}" onclick="setCatFilter('全部')">
      <span class="check">${activeCat === '全部' ? '✓' : ''}</span> 全部
      <span class="count">${allLinks.filter(l=>l.page_type===activeTab).length}</span>
    </div>`,
    ...cats.map(([c, cnt]) => `
      <div class="cat-filter-item${activeCat === c ? ' active' : ''}" onclick="setCatFilter('${escAttr(c)}')">
        <span class="check">${activeCat === c ? '✓' : ''}</span> ${esc(c)}
        <span class="count">${cnt}</span>
      </div>`)
  ].join('');
}

function toggleCatDropdown() {
  const btn = document.getElementById('catFilterBtn');
  const dd = document.getElementById('catFilterDropdown');
  const isOpen = dd.classList.contains('open');
  if (isOpen) { dd.classList.remove('open'); btn.classList.remove('open'); }
  else {
    closeCatDropdown.__closeOthers && closeCatDropdown.__closeOthers();
    renderCatFilterList();
    dd.classList.add('open');
    btn.classList.add('open');
    document.getElementById('catFilterSearch').value = '';
    document.getElementById('catFilterSearch').focus();
  }
}

function closeCatDropdown() {
  document.getElementById('catFilterDropdown').classList.remove('open');
  document.getElementById('catFilterBtn').classList.remove('open');
}

function setCatFilter(c) {
  activeCat = c;
  document.getElementById('catFilterLabel').textContent = c;
  closeCatDropdown();
  renderTable();
}

// 点击外部关闭下拉
document.addEventListener('click', e => {
  const wrap = document.getElementById('catFilterWrap');
  if (wrap && !wrap.contains(e.target)) closeCatDropdown();
});

// ===== 表格 =====
function renderTable() {
  const q = (document.getElementById('filterInput').value || '').toLowerCase();
  let data = allLinks.filter(l => l.page_type === activeTab);
  if (activeCat !== '全部') data = data.filter(l => {
    const cats = l.categories || (l.category ? [l.category] : []);
    return cats.includes(activeCat);
  });
  if (q) data = data.filter(l =>
    (l.title||'').toLowerCase().includes(q) ||
    (l.description||'').toLowerCase().includes(q) ||
    (l.url||'').toLowerCase().includes(q)
  );
  const tbody = document.getElementById('tableBody');
  if (!data.length) { tbody.innerHTML='<tr><td colspan="7" class="empty">无数据，点击上方「+ 新增链接」添加</td></tr>'; return; }
  tbody.innerHTML = data.map(l => {
    const cats = l.categories || (l.category ? [l.category] : []);
    const catTags = cats.map(c => `<span class="cat-tag">${esc(c)}</span>`).join('');
    const typeClass = l.link_type === 'html' ? 'type-html' : 'type-external';
    const typeLabel = l.link_type === 'html' ? '📄 HTML' : '🔗 外站';
    const iconHtml = (activeTab === 'BD推荐') ? `<span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.2);margin-right:6px;vertical-align:middle;font-size:.85rem;overflow:hidden">${renderAdminIcon(l.icon)}</span>` : '';
    return `<tr>
      <td>${l.id}</td>
      <td>${iconHtml}<strong>${esc(l.title)}</strong>${l.description ? `<div style="font-size:.78rem;color:var(--sub);margin-top:3px">${esc(l.description)}</div>` : ''}</td>
      <td><span class="type-badge ${typeClass}">${typeLabel}</span></td>
      <td class="url-cell" title="${esc(l.url)}">${esc(l.url)}</td>
      <td><div class="cat-tags">${catTags || '<span style="color:var(--sub);font-size:.75rem">无</span>'}</div></td>
      <td>${l.sort_order ?? 0}</td>
      <td class="actions">
        <button class="btn btn-sm btn-edit" data-id="${l.id}">✏️</button>
        <button class="btn btn-sm btn-danger btn-delete" data-id="${l.id}">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}

// ===== HTML 文件下拉 =====
function renderHtmlFileSelect() {
  const sel = document.getElementById('htmlFileSelect');
  sel.innerHTML = '<option value="">— 请选择 HTML 文件 —</option>' +
    htmlFiles.map(f => `<option value="${escAttr(f.value)}">${esc(f.label)}${f.description ? ' — ' + esc(f.description) : ''}</option>`).join('');
}

function onHtmlFileSelect() {
  const val = document.getElementById('htmlFileSelect').value;
  if (val) document.getElementById('editUrl').value = val;
}

// ===== 分类多选 Tag =====
function getCurrentCats() {
  // 从 allLinks 中收集当前页面类型已有的所有分类
  const cats = new Set();
  allLinks.filter(l => l.page_type === activeTab).forEach(l => {
    (l.categories || []).forEach(c => cats.add(c));
    if (l.category) cats.add(l.category);
  });
  return [...cats].sort();
}

function renderCatTags() {
  const wrap = document.getElementById('catMultiWrap');
  // 保留输入框和+按钮，只移除 tag
  const input = document.getElementById('catMultiInput');
  const addBtn = document.getElementById('catAddBtn');
  // 移除已有的 tag
  wrap.querySelectorAll('.cat-multi-tag').forEach(t => t.remove());
  // 插入 tag（在 + 按钮之前）
  selectedCats.forEach(cat => {
    const tag = document.createElement('span');
    tag.className = 'cat-multi-tag';
    tag.innerHTML = `${esc(cat)}<span class="remove" onclick="removeCat('${escAttr(cat)}');event.stopPropagation()">×</span>`;
    wrap.insertBefore(tag, addBtn);
  });
  // 更新 + 按钮提示
  addBtn.title = '添加新分类';
}

function addCat(cat) {
  cat = cat.trim();
  if (!cat || selectedCats.includes(cat)) return;
  selectedCats.push(cat);
  renderCatTags();
  document.getElementById('catMultiInput').value = '';
}

function removeCat(cat) {
  selectedCats = selectedCats.filter(c => c !== cat);
  renderCatTags();
}

function onCatInputKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = document.getElementById('catMultiInput').value.trim();
    if (v) addCat(v);
  }
}

// ===== 新建分类弹窗 =====
function openCatNewModal() {
  document.getElementById('catNewModal').classList.add('show');
  document.getElementById('catNewInput').value = '';
  document.getElementById('catNewError').textContent = '';
  setTimeout(() => document.getElementById('catNewInput').focus(), 50);
}

function closeCatNewModal() {
  document.getElementById('catNewModal').classList.remove('show');
}

function confirmCatNew() {
  const v = document.getElementById('catNewInput').value.trim();
  if (!v) { document.getElementById('catNewError').textContent = '分类名称不能为空'; return; }
  if (selectedCats.includes(v)) { document.getElementById('catNewError').textContent = '该分类已存在'; return; }
  addCat(v);
  closeCatNewModal();
}

// 点击外部关闭新建分类弹窗
document.addEventListener('click', e => {
  const m = document.getElementById('catNewModal');
  if (m && m.classList.contains('show') && !m.querySelector('.cat-new-modal').contains(e.target) && !e.target.closest('.cat-add-btn')) {
    closeCatNewModal();
  }
});

// ===== link_type 切换 =====
function onLinkTypeChange() {
  const t = document.getElementById('editLinkType').value;
  const urlWrap = document.getElementById('urlInputWrap');
  const htmlWrap = document.getElementById('htmlFileWrap');
  if (t === 'html') {
    urlWrap.style.display = 'none';
    htmlWrap.classList.add('show');
  } else {
    urlWrap.style.display = 'block';
    htmlWrap.classList.remove('show');
    document.getElementById('editUrl').placeholder = 'https://...';
  }
}

// 列表内的图标渲染（迷你版）
function renderAdminIcon(icon) {
  const v = (icon || '').trim();
  if (!v) return '⚔';
  const escA = s => (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  if (/^https?:\/\//i.test(v)) return `<img src="${escA(v)}" alt="" style="width:18px;height:18px;object-fit:contain">`;
  if (/^[a-z0-9-]+:[a-z0-9-]+$/i.test(v)) return `<img src="https://api.iconify.design/${escA(v)}.svg?color=%23c9a227" alt="" style="width:18px;height:18px;object-fit:contain">`;
  return esc(v);
}

// ===== 图标选择器 =====
// POE2 6 大主职业 + 12 个升华职业概念图标（来自 game-icons 集，免费可商用）
const ICON_PRESETS = [
  { v: 'game-icons:warhammer',          label: '战士' },
  { v: 'game-icons:fire-bow',           label: '游侠' },
  { v: 'game-icons:bone-mace',          label: '巫师' },
  { v: 'game-icons:cowled',             label: '影卫' },
  { v: 'game-icons:embrassed-energy',   label: '武僧' },
  { v: 'game-icons:thunder-blade',      label: '游侠2' },
  { v: 'game-icons:ice-spell-cast',     label: '冰法' },
  { v: 'game-icons:flame',              label: '火法' },
  { v: 'game-icons:lightning-trio',     label: '雷电' },
  { v: 'game-icons:poison-cloud',       label: '毒系' },
  { v: 'game-icons:crossed-swords',     label: '近战' },
  { v: 'game-icons:bow-arrow',          label: '弓箭' },
  { v: 'game-icons:wizard-staff',       label: '法杖' },
  { v: 'game-icons:totem-mask',         label: '图腾' },
  { v: 'game-icons:summon-skull',       label: '召唤' },
  { v: 'game-icons:shield-bash',        label: '盾击' },
  { v: 'game-icons:two-handed-sword',   label: '巨剑' },
  { v: 'game-icons:explosion-rays',     label: '爆破' }
];

function renderIconPreview(v) {
  const p = document.getElementById('iconPreview');
  if (!p) return;
  const val = (v || '').trim();
  if (!val) { p.innerHTML = '⚔'; return; }
  if (/^https?:\/\//i.test(val)) p.innerHTML = `<img src="${val.replace(/"/g,'&quot;')}" alt="">`;
  else if (/^[a-z0-9-]+:[a-z0-9-]+$/i.test(val)) p.innerHTML = `<img src="https://api.iconify.design/${val}.svg?color=%23c9a227" alt="">`;
  else { const d=document.createElement('div'); d.textContent=val; p.innerHTML=d.innerHTML; }
}

function renderIconPresetGrid() {
  const g = document.getElementById('iconPresetGrid');
  if (!g) return;
  const cur = (document.getElementById('editIcon').value || '').trim();
  g.innerHTML = ICON_PRESETS.map(p => `
    <div class="icon-preset${p.v === cur ? ' active' : ''}" onclick="setIcon('${p.v}')" title="${p.v}">
      <img src="https://api.iconify.design/${p.v}.svg?color=%23c9a227" alt="" loading="lazy">
      <span class="icon-preset-label">${p.label}</span>
    </div>
  `).join('');
}

function setIcon(v) {
  const inp = document.getElementById('editIcon');
  if (!inp) return;
  inp.value = v;
  renderIconPreview(v);
  renderIconPresetGrid();
}

function onIconInput() {
  renderIconPreview(document.getElementById('editIcon').value);
  renderIconPresetGrid();
}

function toggleIconPicker(show) {
  const g = document.getElementById('iconPickerGroup');
  if (g) g.style.display = show ? 'block' : 'none';
}

// ===== 模态框 =====
function openAddModal() {
  document.getElementById('modalTitle').textContent = '新增链接';
  document.getElementById('editId').value = '';
  document.getElementById('editTitle').value = '';
  document.getElementById('editDesc').value = '';
  document.getElementById('editUrl').value = '';
  document.getElementById('editLinkType').value = 'external';
  document.getElementById('editPageTypeDisplay').value = activeTab;
  const sortEl = document.getElementById('editSortOrder');
  if (sortEl) sortEl.value = '';
  selectedCats = [];
  renderCatTags();
  setIcon('');
  toggleIconPicker(activeTab === 'BD推荐');
  onLinkTypeChange();
  showModal();
}

function openEditModal(id) {
  const l = allLinks.find(x => x.id === id);
  if (!l) return;
  document.getElementById('modalTitle').textContent = '编辑链接';
  document.getElementById('editId').value = id;
  document.getElementById('editTitle').value = l.title || '';
  document.getElementById('editDesc').value = l.description || '';
  document.getElementById('editUrl').value = l.url || '';
  document.getElementById('editLinkType').value = l.link_type || 'external';
  document.getElementById('editPageTypeDisplay').value = l.page_type || activeTab;
  const sortEl = document.getElementById('editSortOrder');
  if (sortEl) sortEl.value = l.sort_order || 0;
  selectedCats = [...(l.categories || (l.category ? [l.category] : []))];
  renderCatTags();
  setIcon(l.icon || '');
  toggleIconPicker((l.page_type || activeTab) === 'BD推荐');
  onLinkTypeChange();
  showModal();
}

function showModal() { document.getElementById('editModal').classList.add('show'); }
function closeModal() { document.getElementById('editModal').classList.remove('show'); }

// ===== CRUD =====
async function saveLink() {
  const id = document.getElementById('editId').value;
  const title = (document.getElementById('editTitle').value || '').trim();
  const description = (document.getElementById('editDesc').value || '').trim();
  const url = (document.getElementById('editUrl').value || '').trim();
  const link_type = document.getElementById('editLinkType').value;
  const page_type = document.getElementById('editPageTypeDisplay').value;
  const sort_order = parseInt(document.getElementById('editSortOrder').value) || 0;
  const categories = selectedCats.length ? selectedCats : [];
  const icon = (document.getElementById('editIcon').value || '').trim();

  if (!title || !url) { toast('请填写标题和URL', 'error'); return; }
  if (link_type === 'external' && !url.startsWith('http')) { toast('外站链接需以 http(s) 开头', 'error'); return; }

  const payload = { title, description, url, page_type, sort_order, link_type, categories, icon };

  try {
    const method = id ? 'PUT' : 'POST';
    const u = id ? `${API_LINKS}?id=${id}` : API_LINKS;
    const resp = await fetch(u, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const result = await resp.json();
    if (!resp.ok) throw new Error(result.error || '保存失败');
    toast(id ? '✅ 已更新' : '✅ 已新增', 'success');
    closeModal();
    await loadAllData();
  } catch (e) { toast('保存失败: ' + e.message, 'error'); }
}

async function deleteLink(id) {
  const l = allLinks.find(x => x.id === id);
  if (!confirm(`确认删除「${l?.title}」？`)) return;
  try {
    const resp = await fetch(`${API_LINKS}?id=${id}`, { method: 'DELETE' });
    const result = await resp.json();
    if (!resp.ok) throw new Error(result.error || '删除失败');
    toast('🗑️ 已删除', 'info');
    await loadAllData();
  } catch (e) { toast('删除失败: ' + e.message, 'error'); }
}

// ===== 表格事件委托（避免 inline onclick 失效） =====
document.getElementById('tableBody').addEventListener('click', e => {
  const btn = e.target.closest('.btn-edit, .btn-delete');
  if (!btn) return;
  const id = parseInt(btn.dataset.id);
  if (btn.classList.contains('btn-edit')) openEditModal(id);
  else if (btn.classList.contains('btn-delete')) deleteLink(id);
});
// ===== 资讯动态 CRUD =====
function renderNewsTable() {
  const q = (document.getElementById('newsFilterInput').value || '').toLowerCase();
  let data = [...allNews];
  if (q) data = data.filter(n =>
    (n.title||'').toLowerCase().includes(q) ||
    (n.summary||'').toLowerCase().includes(q) ||
    (n.tag||'').toLowerCase().includes(q)
  );
  const tbody = document.getElementById('newsTableBody');
  if (!data.length) { tbody.innerHTML='<tr><td colspan="7" class="empty">无数据，点击上方「+ 新增资讯」添加</td></tr>'; return; }
  tbody.innerHTML = data.map(n => {
    const typeClass = n.content_type === 'markdown' ? 'type-html' : 'type-external';
    const typeLabel = n.content_type === 'markdown' ? '📝 Markdown' : '🔗 链接';
    const tagStyle = n.tag_color ? `background:${n.tag_color}22;color:${n.tag_color}` : '';
    const tagHtml = n.tag ? `<span class="cat-tag" style="${tagStyle}">${esc(n.tag)}</span>` : '<span style="color:var(--sub);font-size:.75rem">无</span>';
    const date = n.published_at ? n.published_at.slice(0, 10) : '-';
    return `<tr>
      <td>${n.id}</td>
      <td><strong>${esc(n.title)}</strong>${n.summary ? `<div style="font-size:.78rem;color:var(--sub);margin-top:3px;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.summary)}</div>` : ''}</td>
      <td>${tagHtml}</td>
      <td><span class="type-badge ${typeClass}">${typeLabel}</span></td>
      <td style="font-size:.82rem;color:var(--sub)">${date}</td>
      <td>${n.sort_order ?? 0}</td>
      <td class="actions">
        <button class="btn btn-sm btn-news-edit" data-id="${n.id}">✏️</button>
        <button class="btn btn-sm btn-danger btn-news-delete" data-id="${n.id}">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}

function onNewsContentTypeChange() {
  const t = document.getElementById('newsContentType').value;
  document.getElementById('newsUrlWrap').style.display = t === 'link' ? 'block' : 'none';
  document.getElementById('newsContentWrap').style.display = t === 'markdown' ? 'block' : 'none';
}

function openAddNewsModal() {
  document.getElementById('newsModalTitle').textContent = '新增资讯';
  document.getElementById('newsEditId').value = '';
  document.getElementById('newsTitle').value = '';
  document.getElementById('newsSummary').value = '';
  document.getElementById('newsTag').value = '';
  document.getElementById('newsTagColor').value = '#1a73e8';
  document.getElementById('newsContentType').value = 'link';
  document.getElementById('newsUrl').value = '';
  document.getElementById('newsContent').value = '';
  document.getElementById('newsPublishedAt').value = new Date().toISOString().slice(0, 10);
  document.getElementById('newsSortOrder').value = '0';
  onNewsContentTypeChange();
  document.getElementById('newsModal').classList.add('show');
}

function openEditNewsModal(id) {
  const n = allNews.find(x => x.id === id);
  if (!n) return;
  document.getElementById('newsModalTitle').textContent = '编辑资讯';
  document.getElementById('newsEditId').value = id;
  document.getElementById('newsTitle').value = n.title || '';
  document.getElementById('newsSummary').value = n.summary || '';
  document.getElementById('newsTag').value = n.tag || '';
  document.getElementById('newsTagColor').value = n.tag_color || '#1a73e8';
  document.getElementById('newsContentType').value = n.content_type || 'link';
  document.getElementById('newsUrl').value = n.url || '';
  document.getElementById('newsContent').value = n.content || '';
  document.getElementById('newsPublishedAt').value = n.published_at ? n.published_at.slice(0, 10) : '';
  document.getElementById('newsSortOrder').value = n.sort_order ?? 0;
  onNewsContentTypeChange();
  document.getElementById('newsModal').classList.add('show');
}

function closeNewsModal() { document.getElementById('newsModal').classList.remove('show'); }

async function saveNews() {
  const id = document.getElementById('newsEditId').value;
  const title = (document.getElementById('newsTitle').value || '').trim();
  const summary = (document.getElementById('newsSummary').value || '').trim();
  const tag = (document.getElementById('newsTag').value || '').trim();
  const tag_color = document.getElementById('newsTagColor').value;
  const content_type = document.getElementById('newsContentType').value;
  const url = (document.getElementById('newsUrl').value || '').trim();
  const content = document.getElementById('newsContent').value;
  const published_at = document.getElementById('newsPublishedAt').value || null;
  const sort_order = parseInt(document.getElementById('newsSortOrder').value) || 0;

  if (!title) { toast('请填写标题', 'error'); return; }
  if (content_type === 'link' && !url) { toast('跳转链接类型需填写 URL', 'error'); return; }
  if (content_type === 'link' && !url.startsWith('http')) { toast('URL 需以 http(s) 开头', 'error'); return; }
  if (content_type === 'markdown' && !content.trim()) { toast('Markdown 类型需填写正文', 'error'); return; }

  const payload = { title, summary, tag, tag_color, content_type, url: content_type === 'link' ? url : null, content: content_type === 'markdown' ? content : null, published_at, sort_order };

  try {
    const method = id ? 'PUT' : 'POST';
    const u = id ? `${API_NEWS}?id=${id}` : API_NEWS;
    const resp = await fetch(u, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const result = await resp.json();
    if (!resp.ok) throw new Error(result.error || '保存失败');
    toast(id ? '✅ 已更新' : '✅ 已新增', 'success');
    closeNewsModal();
    await loadNews();
    renderPageTabs();
    renderNewsTable();
  } catch (e) { toast('保存失败: ' + e.message, 'error'); }
}

async function deleteNews(id) {
  const n = allNews.find(x => x.id === id);
  if (!confirm(`确认删除「${n?.title}」？`)) return;
  try {
    const resp = await fetch(`${API_NEWS}?id=${id}`, { method: 'DELETE' });
    const result = await resp.json();
    if (!resp.ok) throw new Error(result.error || '删除失败');
    toast('🗑️ 已删除', 'info');
    await loadNews();
    renderPageTabs();
    renderNewsTable();
  } catch (e) { toast('删除失败: ' + e.message, 'error'); }
}

document.getElementById('newsTableBody').addEventListener('click', e => {
  const btn = e.target.closest('.btn-news-edit, .btn-news-delete');
  if (!btn) return;
  const id = parseInt(btn.dataset.id);
  if (btn.classList.contains('btn-news-edit')) openEditNewsModal(id);
  else if (btn.classList.contains('btn-news-delete')) deleteNews(id);
});

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`; el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2500);
}

// ===== 工具函数 =====
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escAttr(s) { return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
