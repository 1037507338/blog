<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>资讯动态 - POE2导航</title>
<meta name="description" content="版本更新、联赛资讯、国服活动">
<style data-page-style>
/* 主题变量见 css/style.css */
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(145deg,var(--bg-start) 0%,var(--bg-end) 100%);color:var(--text);line-height:1.6;min-height:100vh;transition:background .3s ease,color .3s ease}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/parchment.css?v=5">
<link rel="stylesheet" href="css/nav-logo.css?v=6">
<link rel="icon" href="favicon.ico">
</head>
<body>
<div id="site-nav"></div>
<main id="view" data-page="news" data-page-href="news.html">
<div class="page-wrap">
  <h1 class="page-title">资讯动态</h1>
  <p class="page-desc">版本更新、联赛资讯、国服活动</p>
  
<div class="filter-bar" id="newsFilter"></div>
<div id="newsList"><p style="text-align:center;color:#d6c08a;padding:2rem">加载中...</p></div>
<style>
.news-card{cursor:pointer;transition:transform .2s,box-shadow .2s}
.news-card:hover{transform:translateY(-2px);box-shadow:var(--card-shadow-hover)}
</style>
<script>
(function(){
let ALL_NEWS=[];
let activeTag="all";

function escHtml(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function fmtDate(s){if(!s)return "";return s.length>10?s.slice(0,10):s}

async function loadNews(){
  try{
    const resp=await fetch("/api/news");
    if(!resp.ok)throw new Error("加载失败");
    ALL_NEWS=await resp.json();
  }catch(e){
    ALL_NEWS=[];
    document.getElementById("newsList").innerHTML='<p style="text-align:center;color:#d6c08a;padding:2rem">加载失败，请稍后重试</p>';
    return;
  }
  renderFilter();
  renderNews();
}

function renderFilter(){
  const tags=new Set();
  ALL_NEWS.forEach(n=>{if(n.tag)tags.add(n.tag)});
  const tagList=[...tags];
  const bar=document.getElementById("newsFilter");
  bar.innerHTML=`<button class="filter-btn${activeTag==="all"?" active":""}" data-tag="all">全部</button>`+
    tagList.map(t=>`<button class="filter-btn${activeTag===t?" active":""}" data-tag="${escHtml(t)}">${escHtml(t)}</button>`).join("");
  bar.querySelectorAll(".filter-btn").forEach(b=>b.addEventListener("click",()=>{
    activeTag=b.dataset.tag;renderFilter();renderNews();
  }));
}

function renderNews(){
  const l=document.getElementById("newsList");if(!l)return;
  const d=activeTag==="all"?ALL_NEWS:ALL_NEWS.filter(n=>n.tag===activeTag);
  if(!d.length){l.innerHTML='<p style="text-align:center;color:#d6c08a;padding:2rem">暂无该分类资讯</p>';return}
  l.innerHTML=d.map(n=>{
    const tagStyle=n.tag_color?`background:${n.tag_color}22;color:${n.tag_color}`:`background:rgba(26,115,232,0.1);color:var(--nav-active)`;
    return `<div class="news-card" data-id="${n.id}" data-type="${escHtml(n.content_type||"link")}" data-url="${escHtml(n.url||"")}">
      <div class="news-meta">
        ${n.tag?`<span class="news-tag" style="${tagStyle}">${escHtml(n.tag)}</span>`:""}
        <span>${escHtml(fmtDate(n.published_at))}</span>
      </div>
      <h3>${escHtml(n.title)}</h3>
      ${n.summary?`<p>${escHtml(n.summary)}</p>`:""}
    </div>`;
  }).join("");
  l.querySelectorAll(".news-card").forEach(c=>c.addEventListener("click",()=>{
    const id=c.dataset.id,type=c.dataset.type,url=c.dataset.url;
    if(type==="link"&&url){window.open(url,"_blank","noopener")}
    else{location.href=`news-detail.html?id=${encodeURIComponent(id)}`}
  }));
}

loadNews();
})();
</script>

</div>
<footer style="text-align:center;padding:2rem 1.5rem;font-size:0.82rem;color:#b8a47a;opacity:0.85">© 2025 POE2 导航站 · 仅供学习交流</footer>
</main>

<script src="js/auth-client.js?v=2" defer></script>
<script src="js/site-nav.js?v=3" defer></script>
<script src="js/router.js?v=1" defer></script>
<script src="js/speed-insights.js" defer></script>
</body>
</html>
