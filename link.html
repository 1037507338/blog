<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title>My Blog - 友链</title>
    <meta name="description" content="一个专注于 Java 后端开发与前沿技术的个人博客">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta http-equiv="Window-target" content="_top">
    <link rel="shortcut icon" href="./blog/amaze/images/compass.png">
    <link rel="stylesheet" href="./X-admin/css/font.css">
    <link rel="stylesheet" href="./blog/amaze/css/base.css">
</head>
<body id="blog">

<!-- 导航栏 -->
<nav class="navbar navbar-default navbar-custom navbar-fixed-top">
    <div class="container-fluid">
        <div class="navbar-header page-scroll">
            <button type="button" class="navbar-toggle" id="navbar-toggle">
                <span class="sr-only"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="./index.html" id="brandName">My Blog</a>
        </div>
        <div class="navbar-collapse" style="display: none" id="toggle-items">
            <ul class="nav navbar-nav navbar-right">
                <li><a href="./index.html">主页</a></li>
                <li><a href="./link.html">友链</a></li>
                <li><a href="./detail.html?id=1">关于</a></li>
                <li><a href="https://github.com/1037507338">GitHub</a></li>
            </ul>
        </div>
        <div id="huxblog_navbar">
            <div class="navbar-collapse">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="./index.html">主页</a></li>
                    <li><a href="./link.html">友链</a></li>
                    <li><a href="./detail.html?id=1">关于</a></li>
                    <li><a href="https://github.com/1037507338">GitHub</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- 头部 Banner -->
<header class="intro-header" style="background-image:url('./blog/amaze/images/header.jpg');">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
                <div class="site-heading">
                    <h1>友情链接</h1>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="am-g am-g-fixed blog-fixed">
    <div class="am-u-lg-8 am-u-sm-12">
        <main class="links-list">
            <div id="favLinks"></div>
            <div id="recLinks"></div>
            <div id="perLinks"></div>
            <h2>链接须知</h2>
            <p>欢迎互换友链 ^_^ 不过请确定贵站可以正常运营.</p>
            <p>我的邮箱是 <span id="sysEmail"></span>, 格式要求如下:</p>
            <ul>
                <li>网站名称：nanjieblog</li>
                <li>网站链接：http://baidu.com</li>
                <li>网站描述：百度的个人博客</li>
            </ul>
            <p>请保证自己的链接长期有效,不然可能会被清理.</p>
        </main>
    </div>
</div>

<!-- 页脚 -->
<footer class="footer blog-footer">
    <div class="blog-text-center">
        &copy; <span id="footerAuthor">博主</span>
        <span class="ft-warn">&heartsuit;</span>&nbsp;site blog
        <a>京ICP备2021003785号</a><br>
        Powered by <a href="#" target="_blank" id="footerCopyright">2024 My Blog</a>
    </div>
</footer>

<script src="./blog/plugins/jquery/jquery.min.js"></script>
<script>
(function() {
    $.getJSON('./data.json', function(data) {
        var config = data.config;
        document.title = config.websiteName + ' - 友链';
        $('#brandName').text(config.websiteName);
        $('#sysEmail').text(config.sysEmail);
        $('#footerAuthor').text(config.sysAuthor);
        $('#footerCopyright').text(config.sysCopyRight);

        var links = data.links;

        // 友链
        if (links.favoriteLinks && links.favoriteLinks.length > 0) {
            var html = '<div class="title"><h3>友链</h3></div><div class="list"><ul>';
            for (var i = 0; i < links.favoriteLinks.length; i++) {
                var l = links.favoriteLinks[i];
                html += '<li><a href="' + l.linkUrl + '" target="_blank">' + l.linkName + '</a> - ' + (l.linkDescription || '') + '</li>';
            }
            html += '</ul></div>';
            $('#favLinks').html(html);
        }

        // 推荐网站
        if (links.recommendLinks && links.recommendLinks.length > 0) {
            var html = '<div class="title"><h3>推荐网站</h3></div><div class="list"><ul>';
            for (var i = 0; i < links.recommendLinks.length; i++) {
                var l = links.recommendLinks[i];
                html += '<li><a href="' + l.linkUrl + '" target="_blank">' + l.linkName + '</a> - ' + (l.linkDescription || '') + '</li>';
            }
            html += '</ul></div>';
            $('#recLinks').html(html);
        }

        // 个人链接
        if (links.personalLinks && links.personalLinks.length > 0) {
            var html = '<div class="title"><h3>个人链接</h3></div><div class="list"><ul>';
            for (var i = 0; i < links.personalLinks.length; i++) {
                var l = links.personalLinks[i];
                html += '<li><a href="' + l.linkUrl + '" target="_blank">' + l.linkName + '</a> - ' + (l.linkDescription || '') + '</li>';
            }
            html += '</ul></div>';
            $('#perLinks').html(html);
        }
    }).fail(function() {
        $('.links-list').prepend('<p style="text-align:center;padding:50px;">数据加载失败，请刷新页面重试</p>');
    });

    $('#navbar-toggle').click(function() {
        $('#toggle-items').fadeToggle('fast');
    });
})();
</script>
</body>
</html>
