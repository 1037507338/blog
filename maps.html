<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>剧情攻略 - POE2 Hub</title>
<meta name="description" content="流放之路2剧情流程攻略，互动式地图导航，记录游戏进度">
<style>
/* ===== 内联关键CSS（主题变量见 css/style.css）===== */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(145deg,var(--bg-start) 0%,var(--bg-end) 100%);color:var(--text);line-height:1.6;min-height:100vh;transition:background .3s ease,color .3s ease}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/parchment.css?v=5">
<link rel="stylesheet" href="css/nav-logo.css?v=1">
<link rel="icon" href="favicon.ico">
<style>
/* 剧情攻略页面样式 */
.story-container{max-width:1400px;margin:0 auto;padding:64px 20px 20px}
.page-title{text-align:center;font-size:1.75rem;margin-bottom:0.5rem}
.page-desc{text-align:center;color:var(--subtext);margin-bottom:1.5rem;font-size:0.9rem}

.act-tabs{display:flex;gap:10px;margin-bottom:1rem;flex-wrap:wrap;justify-content:center}
.act-tab{padding:10px 20px;background:var(--card-bg);border:2px solid var(--card-border);border-radius:8px;cursor:pointer;transition:all 0.3s;font-size:0.9rem;font-weight:600}
.act-tab:hover{border-color:var(--nav-active);transform:translateY(-2px)}
.act-tab.active{background:var(--nav-active);color:#fff;border-color:var(--nav-active)}

.legend{display:flex;gap:20px;padding:12px 16px;background:var(--card-bg);border-radius:8px;margin-bottom:1rem;flex-wrap:wrap;border:1px solid var(--card-border)}
.legend-item{display:flex;align-items:center;gap:8px;font-size:0.85rem}
.legend-dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,0.85);flex-shrink:0}
.legend-dot.pending{background:var(--nav-active)}
.legend-dot.current{background:#ffd43b;border-color:#333}
.legend-dot.completed{background:#51cf66}

.progress-text{text-align:center;font-size:0.85rem;color:var(--subtext);margin-bottom:0.5rem}
.progress-bar{width:100%;height:6px;background:rgba(0,0,0,0.1);border-radius:3px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#51cf66,#69db7c);transition:width 0.3s}

.map-container{position:relative;width:100%;max-width:1200px;margin:0 auto 2rem;background:var(--card-bg);border-radius:12px;overflow:hidden;box-shadow:var(--card-shadow);border:1px solid var(--card-border)}
.map-wrapper{position:relative;width:100%;padding-bottom:75%;background:#0d0d1a}
.map-image{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}

.node-marker{position:absolute;width:32px;height:32px;background:var(--nav-active);border:3px solid #fff;border-radius:50%;cursor:pointer;transform:translate(-50%,-50%);transition:all 0.3s;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,0.3);z-index:10}
.node-marker:hover{transform:translate(-50%,-50%) scale(1.3);box-shadow:0 4px 16px rgba(0,0,0,0.4);z-index:20}
.node-marker.active{background:#ff6b6b;animation:pulse 1.5s infinite}
.node-marker.completed{background:#51cf66}
.node-marker.current{background:#ffd43b;border-color:#333}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,0.7)}50%{box-shadow:0 0 0 10px rgba(255,107,107,0)}}

.detail-panel{position:fixed;right:-420px;top:48px;width:400px;height:calc(100vh - 48px);background:var(--card-bg);border-left:1px solid var(--card-border);transition:right 0.3s;z-index:1000;overflow-y:auto;box-shadow:-4px 0 16px rgba(0,0,0,0.1)}
.detail-panel.open{right:0}
.detail-header{padding:16px;background:var(--nav-active);color:#fff;position:sticky;top:0;z-index:10}
.detail-header h2{margin:0 0 4px 0;font-size:1.1rem}
.detail-header .hint{font-size:0.85rem;opacity:0.9}
.close-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:#fff;font-size:26px;cursor:pointer;line-height:1;opacity:0.8}
.close-btn:hover{opacity:1}
.detail-content{padding:16px}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:0.75rem;font-weight:600;margin-bottom:12px}
.badge.skill{background:#4dabf7;color:#fff}
.badge.loot{background:#69db7c;color:#333}
.badge.danger{background:#ff6b6b;color:#fff}
.badge.season-reward{background:linear-gradient(135deg,#c9a227,#f4dc99);color:#1a140c;border:1px solid rgba(201,162,39,0.6);box-shadow:0 1px 4px rgba(201,162,39,0.3);font-weight:700;margin-left:6px}
.steps-list{padding:0;margin:1rem 0;display:flex;flex-direction:column;gap:8px}
.step-item{padding:12px;background:rgba(0,0,0,0.04);border-radius:6px;border-left:3px solid var(--nav-active);font-size:0.9rem;line-height:1.6}
.step-item .step-title{font-weight:700;margin-bottom:4px;color:var(--nav-active);display:block}
.step-item .step-body{color:var(--text)}
.node-images{display:grid;gap:8px;margin-top:12px}
.node-images img{width:100%;border-radius:6px;cursor:pointer;transition:transform 0.3s}
.node-images img:hover{transform:scale(1.02)}
.nav-buttons{display:flex;gap:8px;margin-top:16px}
.nav-btn{flex:1;padding:8px;background:var(--nav-active);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.85rem;transition:all 0.3s}
.nav-btn:hover{opacity:0.9}
.nav-btn:disabled{background:#ccc;cursor:not-allowed}

.image-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:2000;align-items:center;justify-content:center;cursor:zoom-out}
.image-modal.open{display:flex}
.image-modal img{max-width:90%;max-height:90%;object-fit:contain}

@media (max-width:768px){
.detail-panel{width:100%;right:-100%}
.act-tab{padding:8px 16px;font-size:0.85rem}
}
</style>
<script src="js/common.js"></script>
</head>
<body>

<!-- 顶部站点导航栏 -->
<nav id="site-nav-mount"></nav>


<div class="story-container">
  <h1 class="page-title">剧情流程攻略</h1>
  <p class="page-desc">点击地图节点查看详细攻略，记录你的游戏进度</p>
  
  <div class="legend">
    <div class="legend-item"><div class="legend-dot pending"></div><span>待完成</span></div>
    <div class="legend-item"><div class="legend-dot current"></div><span>当前位置</span></div>
    <div class="legend-item"><div class="legend-dot completed"></div><span>已完成</span></div>
  </div>
  
  <div class="act-tabs" id="actTabs"></div>
  
  <div class="progress-text" id="progressText">进度: 0/0 节点</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  
  <div class="map-container">
    <div class="map-wrapper" id="mapWrapper">
      <img class="map-image" id="mapImage" src="" alt="章节地图">
    </div>
  </div>
</div>

<div class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <button class="close-btn" onclick="closeDetail()">&times;</button>
    <h2 id="nodeTitle">节点标题</h2>
    <div class="hint" id="nodeHint"></div>
  </div>
  <div class="detail-content">
    <div id="nodeBadge"></div>
    <p id="nodeDescription" style="font-size:0.9rem;color:#d6c08a;white-space:pre-line"></p>
    <div class="steps-list" id="nodeSteps"></div>
    <div class="node-images" id="nodeImages"></div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" onclick="navigateNode(-1)">上一步</button>
      <button class="nav-btn" id="nextBtn" onclick="navigateNode(1)">下一步</button>
    </div>
  </div>
</div>

<div class="image-modal" id="imageModal" onclick="closeModal()">
  <img id="modalImage" src="" alt="放大图片">
</div>

<footer>
  <small>© 2025 POE2 国服攻略站 · 数据来源 <a href="https://www.poe2wiki.net" target="_blank">POE2 Wiki</a> · 攻略参考 <a href="https://liazr.github.io/Poe2Storyguide/" target="_blank">Poe2Storyguide</a></small>
</footer>

<script src="js/story.js?v=3" defer></script>
<script src="js/speed-insights.js" defer></script>
</body>
</html>
