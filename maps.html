<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异界攻略 - POE2 Hub</title>
<style>
:root {
  --bg-start: #12100e;
  --bg-end: #1a1610;
  --card-bg: rgba(30,24,18,0.92);
  --card-border: #3d2e14;
  --text: #e8d9b8;
  --subtext: #a89868;
  --accent: #c9a227;
  --accent-hover: #f4dc99;
  --link: #c9a227;
  --link-hover: #f4dc99;
  --nav-bg: rgba(18,14,10,0.96);
  --nav-border: #3d2e14;
  --nav-link: #a89868;
  --nav-link-hover: #f4dc99;
  --nav-active: #c9a227;
  --section-title: #f4dc99;
  --table-th-bg: rgba(201,162,39,0.12);
  --table-border: #3d2e14;
  --tab-bg: rgba(37,28,17,0.8);
  --tab-active-bg: rgba(201,162,39,0.2);
  --tab-border: #4d3a1f;
  --tab-text: #a89868;
  --tab-active-text: #f4dc99;
  --search-bg: rgba(37,28,17,0.8);
  --search-border: #4d3a1f;
  --badge-yes: #2d6e2d;
  --badge-yes-text: #a8e8a8;
  --badge-no: #444;
  --badge-no-text: #999;
}
[data-theme="light"] {
  --bg-start: #f5f0e4;
  --bg-end: #ece6d8;
  --card-bg: rgba(255,250,238,0.95);
  --card-border: #d8c080;
  --text: #3a2e15;
  --subtext: #6b5530;
  --accent: #b8860b;
  --link: #8b6508;
  --link-hover: #5a3e08;
  --nav-bg: rgba(245,235,210,0.96);
  --nav-border: #d8c080;
  --nav-link: #6b5530;
  --nav-link-hover: #3a2e15;
  --nav-active: #8b6508;
  --section-title: #6b4a08;
  --table-th-bg: #ede0bd;
  --table-border: #d8c080;
  --tab-bg: #ede0bd;
  --tab-active-bg: rgba(201,162,39,0.32);
  --tab-border: #c9a227;
  --tab-text: #6b5530;
  --tab-active-text: #4a3208;
  --search-bg: rgba(255,255,255,0.7);
  --search-border: #d8c080;
  --badge-yes: #4caf50;
  --badge-yes-text: #fff;
  --badge-no: #bbb;
  --badge-no-text: #fff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Serif SC","SimSun",serif;background:linear-gradient(160deg,var(--bg-start) 0%,var(--bg-end) 100%);color:var(--text);min-height:100vh;line-height:1.7;transition:background .3s,color .3s}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover)}

/* 共享导航样式 */
.site-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--nav-border);height:48px;transition:background .3s,border-color .3s}
.site-nav-inner{max-width:1400px;margin:0 auto;padding:0 1.5rem;height:100%;display:flex;align-items:center;gap:0}
.site-nav-logo{font-family:"Noto Serif SC",serif;font-size:1rem;font-weight:600;color:#f4dc99;text-decoration:none;margin-right:24px;flex-shrink:0;display:flex;align-items:center;gap:6px;transition:color .2s;letter-spacing:0.06em}
.site-nav-logo:hover{color:#f4dc99}
.site-nav-links{display:flex;align-items:center;gap:0;flex:1}
.site-nav-link{padding:0 14px;height:48px;line-height:48px;font-size:.88rem;font-weight:500;color:var(--nav-link);text-decoration:none;transition:color .2s,background .2s;white-space:nowrap}
.site-nav-link:hover{color:var(--nav-link-hover);background:rgba(128,128,128,.06)}
.site-nav-link.active{color:var(--nav-active);font-weight:600}
.site-nav-toggle{display:none;flex-direction:column;gap:5px;padding:8px;background:none;border:none;cursor:pointer}
.site-nav-toggle span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:.3s}
#theme-toggle{position:fixed;top:56px;right:1.5rem;z-index:1001;background:var(--tab-bg);border:1px solid var(--tab-border);border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--text);font-size:.8rem;transition:background .2s,border-color .2s}
#back-to-top{position:fixed;bottom:2rem;right:1.5rem;z-index:1001;background:var(--tab-bg);border:1px solid var(--tab-border);border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--text);font-size:.9rem;opacity:0;transition:opacity .3s,transform .2s}
#back-to-top.visible{opacity:1}
#back-to-top:hover{transform:translateY(-2px)}
@media(max-width:768px){
  .site-nav-links{display:none;position:absolute;top:48px;left:0;right:0;background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--nav-border);flex-direction:column;padding:8px;gap:0}
  .site-nav-links.open{display:flex}
  .site-nav-link{padding:10px 14px;height:auto;line-height:1.5;border-radius:6px}
  .site-nav-toggle{display:flex}
}

/* 页面主体 */
.page-container{max-width:1000px;margin:0 auto;padding:64px 1.5rem 4rem}
.page-header{text-align:center;margin-bottom:2rem}
.page-title{font-size:1.9rem;font-weight:700;color:var(--section-title);margin-bottom:.4rem;letter-spacing:0.1em}
.page-subtitle{font-size:.9rem;color:var(--subtext)}

/* Tab 切换 */
.tab-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:1.5rem}
.tab-btn{padding:8px 18px;background:var(--tab-bg);border:1px solid var(--tab-border);border-radius:8px;color:var(--tab-text);cursor:pointer;font-size:.9rem;font-family:inherit;transition:all .2s;white-space:nowrap}
.tab-btn.active{background:var(--tab-active-bg);border-color:var(--accent);color:var(--tab-active-text);font-weight:600}
.tab-btn:hover:not(.active){color:var(--tab-active-text);border-color:var(--accent)}

/* 搜索 */
.search-box{margin-bottom:1.5rem}
.search-input{width:100%;max-width:400px;padding:9px 14px;background:var(--search-bg);border:1px solid var(--search-border);border-radius:8px;color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--subtext);opacity:.7}

/* Tab 内容区 */
.tab-content{display:none}
.tab-content.active{display:block}

/* 区块标题 */
.section-title{font-size:1.1rem;font-weight:600;color:var(--section-title);margin:1.5rem 0 .75rem;padding-bottom:.4rem;border-bottom:1px solid var(--accent);letter-spacing:0.05em}

/* 数据表 */
.data-table{width:100%;border-collapse:collapse;margin:.75rem 0 1.5rem}
.data-table th{background:var(--table-th-bg);color:var(--accent);padding:10px 14px;text-align:left;border-bottom:2px solid var(--accent);font-size:.88rem;font-weight:600;white-space:nowrap}
.data-table td{padding:9px 14px;border-bottom:1px solid var(--table-border);font-size:.9rem;vertical-align:top}
.data-table tr:hover td{background:rgba(201,162,39,.05)}
.data-table .col-rumor{font-weight:600;color:var(--accent);white-space:nowrap}
.data-table .col-map{color:var(--text)}
.data-table .col-boss{color:var(--text);white-space:nowrap}
.data-table .col-drop{color:var(--subtext);font-size:.85rem}
.data-table .col-respawn{text-align:center}
.data-table .col-extra{color:var(--subtext);font-size:.85rem}

/* Badge */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.badge-yes{background:var(--badge-yes);color:var(--badge-yes-text)}
.badge-no{background:var(--badge-no);color:var(--badge-no-text)}

/* 说明文字 */
.note-box{background:rgba(201,162,39,.06);border:1px solid var(--card-border);border-radius:8px;padding:12px 16px;margin:.5rem 0 1rem;font-size:.85rem;color:var(--subtext);line-height:1.8}
.note-box strong{color:var(--accent)}

/* 无结果 */
.no-results{padding:2rem;text-align:center;color:var(--subtext);font-size:.9rem}

/* 浅色主题 */
[data-theme="light"] .page-title{color:#6b4a08}
[data-theme="light"] .data-table th{color:#6b4a08}
[data-theme="light"] .section-title{color:#6b4a08;border-bottom-color:#c9a227}
[data-theme="light"] .note-box{background:rgba(201,162,39,.08)}
</style>
</head>
<body>

<div id="site-nav"></div>

<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">异界攻略</h1>
    <p class="page-subtitle">岛屿传言 · 炸坟岛屿 · 传奇地图 — 航海流言全收录</p>
  </div>

  <!-- Tab 导航 -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="showTab('island')">航海流言</button>
    <button class="tab-btn" onclick="showTab('tomb')">炸坟岛屿</button>
    <button class="tab-btn" onclick="showTab('legend')">传奇地图</button>
  </div>

  <!-- 搜索 -->
  <div class="search-box">
    <input type="text" class="search-input" id="search-input" placeholder="搜索传言、地图名、Boss…" autocomplete="off">
  </div>

  <!-- Tab: 航海流言（首领传言） -->
  <div id="island" class="tab-content active">
    <h2 class="section-title">首领传言</h2>
    <p class="note-box">
      <strong>首领传言</strong>触发条件：鼠标悬停小船图标，会显示1～3条关于未知海域的岛屿传言，对应下方表格内容。<br>
      <strong>沃拉娜的围攻</strong>实际由梅德维德掉落，非沃拉娜。
    </p>
    <table class="data-table" id="island-table">
      <thead>
        <tr>
          <th>传言名称</th>
          <th>对应地图</th>
          <th>首领</th>
          <th>高价值掉落</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Tab: 炸坟岛屿 -->
  <div id="tomb" class="tab-content">
    <h2 class="section-title">炸坟岛屿传言</h2>
    <p class="note-box">
      <strong>炸坟岛</strong>：带有漩涡图标的普通地图（非传奇），不会掉落探险日志。<br>
      <strong>无限复活</strong>：可=该岛屿可无限复活；—=不可复活。
    </p>
    <table class="data-table" id="tomb-table">
      <thead>
        <tr>
          <th>传言名称</th>
          <th>地图</th>
          <th>无限复活</th>
          <th>额外内容</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Tab: 传奇地图 -->
  <div id="legend" class="tab-content">
    <h2 class="section-title">传奇地图传言</h2>
    <p class="note-box">传奇地图（非炸坟岛）对应的岛屿传言，提供额外收益或特殊内容。</p>
    <table class="data-table" id="legend-table">
      <thead>
        <tr>
          <th>传言名称</th>
          <th>对应地图</th>
          <th>内容</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
// ===== 数据（国服版本）=====
const islandData = [
  { rumor: "陨落的源头", map: "无名之岛", boss: "欧罗什", drop: "英雄悲剧珠宝、欧罗什的太阳徽记、破碎三曲" },
  { rumor: "吞星者", map: "静谧神庙", boss: "乌崔德", drop: "魔力符文任务道具、乌特雷系列技能（待确认）" },
  { rumor: "最后一个倒下", map: "恸哭悬崖", boss: "沃拉娜", drop: "—" },
  { rumor: "循环的尽头", map: "蔓生丛林", boss: "梅德维德", drop: "沃拉娜的围攻" },
];

const tombData = [
  { rumor: "未知的废墟", map: "掘尸遗迹", respawn: false, extra: "免费日志" },
  { rumor: "无尽的悬崖", map: "乱石半岛", respawn: false, extra: "—" },
  { rumor: "荒凉而可怕", map: "褪色浅滩", respawn: false, extra: "—" },
  { rumor: "肆意奔走的野性", map: "牧野荒原", respawn: false, extra: "小精灵" },
  { rumor: "至少很干燥", map: "脱落沟壑", respawn: false, extra: "—" },
  { rumor: "亚硫酸！", map: "焦灼小岛", respawn: false, extra: "—" },
  { rumor: "有点可疑", map: "贫瘠环礁", respawn: true, extra: "保险箱" },
  { rumor: "寒冷如冰", map: "凛风悬崖", respawn: true, extra: "—" },
  { rumor: "温暖但危险", map: "笼葱海岛", respawn: true, extra: "—" },
  { rumor: "没东西喝", map: "死水盆地", respawn: false, extra: "—" },
];

const legendData = [
  { rumor: "一个好人", map: "顿悟时刻", content: "无名先知" },
  { rumor: "倒映的水面", map: "千裂泽", content: "碎裂的魔镜" },
  { rumor: "近乎天堂", map: "纯净乐园", content: "经验图" },
  { rumor: "坠落的星辰", map: "天陨荒原", content: "8孔遗物" },
  { rumor: "所有闪闪发光之物", map: "颠沛领域", content: "金币图" },
];

// ===== Tab 切换 =====
function showTab(tabName) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(tabName).classList.add('active');
  document.querySelector('.tab-btn[onclick="showTab(\'' + tabName + '\')"]').classList.add('active');
  document.getElementById('search-input').value = '';
  renderAllTables('');
}

// ===== 渲染首领传言 =====
function renderIslandTable(q) {
  const tbody = document.querySelector('#island-table tbody');
  const qLower = (q || '').toLowerCase();
  const rows = islandData.filter(item =>
    !qLower ||
    item.rumor.toLowerCase().includes(qLower) ||
    item.map.toLowerCase().includes(qLower) ||
    item.boss.toLowerCase().includes(qLower) ||
    item.drop.toLowerCase().includes(qLower)
  );
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="4" class="no-results">没有匹配的结果</td></tr>'; return; }
  tbody.innerHTML = rows.map(i =>
    `<tr><td class="col-rumor">${esc(i.rumor)}</td><td class="col-map">${esc(i.map)}</td><td class="col-boss">${esc(i.boss)}</td><td class="col-drop">${esc(i.drop)}</td></tr>`
  ).join('');
}

// ===== 渲染炸坟岛 =====
function renderTombTable(q) {
  const tbody = document.querySelector('#tomb-table tbody');
  const qLower = (q || '').toLowerCase();
  const rows = tombData.filter(item =>
    !qLower ||
    item.rumor.toLowerCase().includes(qLower) ||
    item.map.toLowerCase().includes(qLower) ||
    item.extra.toLowerCase().includes(qLower)
  );
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="4" class="no-results">没有匹配的结果</td></tr>'; return; }
  tbody.innerHTML = rows.map(i =>
    `<tr><td class="col-rumor">${esc(i.rumor)}</td><td class="col-map">${esc(i.map)}</td><td class="col-respawn"><span class="badge ${i.respawn ? 'badge-yes' : 'badge-no'}">${i.respawn ? '可' : '—'}</span></td><td class="col-extra">${esc(i.extra)}</td></tr>`
  ).join('');
}

// ===== 渲染传奇地图 =====
function renderLegendTable(q) {
  const tbody = document.querySelector('#legend-table tbody');
  const qLower = (q || '').toLowerCase();
  const rows = legendData.filter(item =>
    !qLower ||
    item.rumor.toLowerCase().includes(qLower) ||
    item.map.toLowerCase().includes(qLower) ||
    item.content.toLowerCase().includes(qLower)
  );
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="3" class="no-results">没有匹配的结果</td></tr>'; return; }
  tbody.innerHTML = rows.map(i =>
    `<tr><td class="col-rumor">${esc(i.rumor)}</td><td class="col-map">${esc(i.map)}</td><td class="col-extra">${esc(i.content)}</td></tr>`
  ).join('');
}

function renderAllTables(q) {
  renderIslandTable(q);
  renderTombTable(q);
  renderLegendTable(q);
}

// ===== 搜索 =====
let searchTimer;
document.getElementById('search-input').addEventListener('input', function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => renderAllTables(this.value), 80);
});

// ===== 工具 =====
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ===== 初始化渲染 =====
renderAllTables('');
</script>
<script src="js/site-nav.js?v=3" defer></script>
</body>
</html>
