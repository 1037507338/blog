<style>
/* ===== 进阶攻略列表页 ===== */
.adv-filter{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 1.4rem;align-items:center}
.adv-filter-btn{
  padding:6px 16px;border-radius:2px;font-size:.82rem;font-weight:600;
  font-family:'Noto Serif SC',serif;letter-spacing:.04em;cursor:pointer;
  background:rgba(40,30,15,.55);color:#b8a47a;
  border:1px solid #4d3a1f;transition:all .25s;
}
.adv-filter-btn:hover{color:#f4dc99;border-color:#c9a227}
.adv-filter-btn.active{background:linear-gradient(135deg,#c9a227,#8b6914);color:#1a140c;border-color:#c9a227;font-weight:700}

/* 表格容器 */
.adv-wrap{
  background:linear-gradient(180deg,rgba(26,20,12,.92),rgba(13,10,7,.92));
  border:1px solid #4d3a1f;border-radius:4px;overflow:hidden;
  box-shadow:0 8px 28px -10px rgba(0,0,0,.6);
}
.adv-table{width:100%;border-collapse:collapse;font-size:.9rem}
.adv-table thead th{
  background:linear-gradient(180deg,#322615,#251c11);
  color:#f4dc99;font-family:'Noto Serif SC',serif;font-weight:700;
  font-size:.86rem;letter-spacing:.08em;text-align:left;
  padding:.95rem 1.1rem;border-bottom:2px solid #c9a227;white-space:nowrap;
}
.adv-table tbody tr{
  border-bottom:1px solid rgba(77,58,31,.6);transition:background .2s;
}
.adv-table tbody tr:last-child{border-bottom:none}
.adv-table tbody tr:hover{background:rgba(201,162,39,.06)}
.adv-table td{padding:.95rem 1.1rem;vertical-align:middle}

/* 标题列 —— 高对比亮色 */
.adv-title{font-family:'Noto Serif SC',serif;font-weight:700;color:#f4dc99;font-size:.98rem;line-height:1.4}
/* 副标题 —— 次级但仍清晰 */
.adv-sub{color:#cdb888;font-size:.82rem;margin-top:3px;line-height:1.45}
/* 时间 —— 等宽，柔和金 */
.adv-time{font-family:'IBM Plex Mono',monospace;color:#b8a47a;font-size:.82rem;white-space:nowrap}
.adv-time.empty{color:#6b5536}
/* 分类标签 */
.adv-cats{display:flex;flex-wrap:wrap;gap:5px}
.adv-cat{
  display:inline-block;padding:2px 9px;border-radius:2px;font-size:.72rem;font-weight:600;
  background:rgba(201,162,39,.14);color:#e8c860;border:1px solid rgba(201,162,39,.35);white-space:nowrap;
}
/* 跳转按钮 —— 高级金色，独立可点 */
.adv-go{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 16px;border-radius:2px;font-size:.82rem;font-weight:700;
  font-family:'Noto Serif SC',serif;letter-spacing:.05em;cursor:pointer;
  color:#1a140c;background:linear-gradient(135deg,#f4dc99,#c9a227);
  border:1px solid #c9a227;text-decoration:none;white-space:nowrap;
  transition:transform .2s,box-shadow .2s,filter .2s;
}
.adv-go:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(201,162,39,.45);filter:brightness(1.08)}
.adv-go:active{transform:translateY(0)}
.adv-go .arr{font-family:'IBM Plex Mono',monospace;font-weight:400}

.adv-state{text-align:center;padding:3rem 1rem;color:#cdb888;font-size:.92rem}

/* 移动端：表格转卡片 */
@media(max-width:720px){
  .adv-table thead{display:none}
  .adv-table,.adv-table tbody,.adv-table tr,.adv-table td{display:block;width:100%}
  .adv-table tr{padding:.9rem 1rem;position:relative}
  .adv-table td{padding:.25rem 0;border:none}
  .adv-table td[data-label]::before{
    content:attr(data-label);display:inline-block;min-width:64px;
    color:#897653;font-size:.74rem;font-family:'Noto Serif SC',serif;margin-right:8px;
  }
  .adv-go{margin-top:.6rem}
}
</style>

<div class="page-wrap">
  <h1 class="page-title">进阶攻略</h1>
  <p class="page-desc">终局玩法、机制深度解析与效率提升技巧</p>

  <div class="adv-filter" id="advFilter"></div>
  <div class="adv-wrap">
    <table class="adv-table">
      <thead>
        <tr>
          <th style="width:38%">标题 / 副标题</th>
          <th style="width:14%">时间</th>
          <th style="width:28%">分类</th>
          <th style="width:20%;text-align:right">操作</th>
        </tr>

        <tr><td colspan="4"><div class="adv-state">加载中…</div></td></tr>
      </tbody>
    </table>

<footer style="text-align:center;padding:2rem 1.5rem;font-size:0.82rem;color:#b8a47a;opacity:0.85">© 2025 POE2 Hub · 仅供学习交流</footer>

<script>
let ALL=[];
let activeCat='全部';

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtDate(s){if(!s)return '';return s.length>10?s.slice(0,10):s}

async function load(){
  try{
    const resp=await fetch('/api/links?page_type='+encodeURIComponent('进阶攻略'));
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    ALL=await resp.json();
  }catch(e){
    document.getElementById('advBody').innerHTML='<tr><td colspan="4"><div class="adv-state">加载失败，请稍后重试</div></td></tr>';
    return;
  }
  // 按时间倒序（无时间排末尾），再按 sort_order
  ALL.sort((a,b)=>{
    const ta=a.created_at||'', tb=b.created_at||'';
    if(ta&&tb&&ta!==tb)return tb.localeCompare(ta);
    if(ta&&!tb)return -1;
    if(!ta&&tb)return 1;
    return (a.sort_order||0)-(b.sort_order||0);
  });
  renderFilter();
  render();
}

function renderFilter(){
  const cats=new Set();
  ALL.forEach(x=>(x.categories||[]).forEach(c=>cats.add(c)));
  const list=['全部',...cats];
  document.getElementById('advFilter').innerHTML=list.map(c=>
    `<button class="adv-filter-btn${activeCat===c?' active':''}" data-cat="${esc(c)}">${esc(c)}</button>`
  ).join('');
  document.querySelectorAll('.adv-filter-btn').forEach(b=>b.addEventListener('click',()=>{
    activeCat=b.dataset.cat;renderFilter();render();
  }));
}

function render(){
  const body=document.getElementById('advBody');
  const rows=activeCat==='全部'?ALL:ALL.filter(x=>(x.categories||[]).includes(activeCat));
  if(!rows.length){
    body.innerHTML='<tr><td colspan="4"><div class="adv-state">暂无进阶攻略</div></td></tr>';
    return;
  }
  body.innerHTML=rows.map(x=>{
    const cats=(x.categories||[]).map(c=>`<span class="adv-cat">${esc(c)}</span>`).join('');
    const t=fmtDate(x.created_at);
    const timeCell=t?`<span class="adv-time">${esc(t)}</span>`:`<span class="adv-time empty">—</span>`;
    // 站内 html 当前页打开，外链新标签
    const isHtml=x.link_type==='html';
    const target=isHtml?'':' target="_blank" rel="noopener"';
    const go=x.url?`<a class="adv-go" href="${esc(x.url)}"${target}>查看 <span class="arr">→</span></a>`:'';
    return `<tr>
      <td data-label="标题">
        <div class="adv-title">${esc(x.title)}</div>
        ${x.description?`<div class="adv-sub">${esc(x.description)}</div>`:''}
      </td>
      <td data-label="时间">${timeCell}</td>
      <td data-label="分类"><div class="adv-cats">${cats||'<span class="adv-time empty">—</span>'}</div></td>
      <td data-label="操作" style="text-align:right">${go}</td>
    </tr>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded',load);
</script>
